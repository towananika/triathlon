<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>世界の暮らし試作 | TRIATHLON</title><script type="module" src="../login/auth.js?v=0.28"></script><style>body{background:#f4f8f5;color:#173f43;font:16px/1.7 system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:24px 16px 60px}a{color:#16776b}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:#25796d;color:white;cursor:pointer}iframe{width:100%;height:1600px;border:0;border-radius:16px;background:#f3f8f5}#status{color:#55786b}</style></head><body><main><a href="./">← ゲーム企画と世界観</a><p id="status" role="status">ログイン状態を確認しています。</p><button id="login" hidden>Googleでログイン</button><div id="game" hidden></div></main><script>
(function(){const status=document.getElementById('status'),login=document.getElementById('login'),game=document.getElementById('game');let revision=0;login.onclick=async()=>{try{await window.triLogin('google')}catch(e){status.textContent='ログインできませんでした。もう一度お試しください。'}};async function show(user){const n=++revision;game.hidden=true;game.replaceChildren();if(!user){status.textContent='世界の試作を開くには、管理者のGoogleアカウントでログインしてください。';login.hidden=false;return}login.hidden=true;status.textContent='世界の試作を読み込んでいます。';try{const f=await window.triDB(),doc=await f.getDoc(f.doc(f.db,'triathlonPlanning','main'));if(n!==revision)return;if(!doc.exists()||typeof doc.data().world!=='string')throw Error('missing');const parsed=new DOMParser().parseFromString(doc.data().world,'text/html');const style=parsed.querySelector('style'),view=parsed.querySelector('main'),logic=parsed.querySelector('script');if(!style||!view||!logic)throw Error('invalid battle data');game.append(style,view);const run=document.createElement('script');run.textContent=logic.textContent;game.append(run);game.hidden=false;status.textContent='管理者として世界の試作を表示しています。'}catch(e){if(n!==revision)return;status.textContent='世界の試作を読み込めません。管理者アカウントとアクセス権を確認してください。';login.hidden=false;login.textContent='別のGoogleアカウントでログイン'}}document.addEventListener('tri-user',e=>show(e.detail));if(window.TRI_USER!==undefined)show(window.TRI_USER)})();
</script></body></html>
