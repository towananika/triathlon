<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ゲーム企画 | TRIATHLON</title><script type="module" src="../login/auth.js?v=0.28"></script><style>body{background:#f4f8f5;color:#173f43;font:16px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:32px 20px 70px}h1{font-size:clamp(25px,5vw,38px)}a{color:#16776b}.card{background:white;border:1px solid #dae9df;border-radius:16px;padding:22px;margin:20px 0}.button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:#25796d;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.9}#status{color:#55786b}</style></head><body><main><a href="../">← トライアスロンのホーム</a><h1>ゲーム企画と世界観</h1><p>管理者用の企画資料です。トライアスロンのGoogleログインで開きます。</p><p><a href="battle.html">チーム模擬戦を開く</a></p><section class="card"><p id="status" role="status">ログイン状態を確認しています。</p><button class="button" id="login" hidden>Googleでログイン</button><pre id="content"></pre></section></main><script>
(function(){const status=document.getElementById('status'),login=document.getElementById('login'),content=document.getElementById('content');let revision=0;login.onclick=async()=>{try{await window.triLogin('google')}catch(e){status.textContent='ログインできませんでした。もう一度お試しください。'}};async function show(user){const n=++revision;content.textContent='';if(!user){status.textContent='企画を見るには、管理者のGoogleアカウントでログインしてください。';login.hidden=false;return}login.hidden=true;status.textContent='企画を読み込んでいます。';try{const f=await window.triDB(),doc=await f.getDoc(f.doc(f.db,'triathlonPlanning','main'));if(n!==revision)return;if(!doc.exists()||typeof doc.data().content!=='string')throw Error('missing');content.textContent=doc.data().content;status.textContent='管理者として表示しています。'}catch(e){if(n!==revision)return;status.textContent='企画を読み込めません。管理者アカウントとアクセス権を確認してください。';login.hidden=false;login.textContent='別のGoogleアカウントでログイン'}}document.addEventListener('tri-user',e=>show(e.detail));if(window.TRI_USER!==undefined)show(window.TRI_USER)})();
</script></body></html>
