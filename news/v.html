<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TRIATHLON の版ごとのアップデート内容。">
<title>アップデート | TRIATHLON</title>
<link rel="stylesheet" href="news.css?v=0.24">
</head>
<body>
<script src="../site-nav.js?v=0.50"></script>
<main id="post">
<p class="crumb"><a href="./">← お知らせ一覧</a></p>
</main>
<footer><a href="./">お知らせ一覧</a> / <a href="rules.html">アップデートの基準</a> / <a href="../">TRIATHLON トップ</a></footer>
<script src="news.js?v=0.50"></script>
<script>
(function () {
  'use strict';
  var CAT = {update:'アップデート', info:'お知らせ', fix:'修正'}, KIND = {new:'追加', change:'変更', fix:'修正', doc:'記録'};
  var list = window.TRI_NEWS || [], id = new URLSearchParams(location.search).get('id'), box = document.getElementById('post');
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var i = list.findIndex(function(n){ return n.id === id; });
  if (!id && list.length) i = 0;
  var n = list[i];
  if (!n) { box.insertAdjacentHTML('beforeend', '<section class="post"><h1>この版のページは見つかりませんでした</h1><p class="lead">お知らせ一覧から選んでください。</p></section>'); return; }
  document.title = (n.ver ? n.ver + ' ' : '') + n.title + ' | TRIATHLON';
  var h = '<article class="post"><p class="meta"><span class="cat c-' + n.cat + '">' + CAT[n.cat] + '</span>' + (n.ver ? '<span class="ver">' + esc(n.ver) + '</span>' : '') + window.triNewsTimes(n) + (i === 0 ? '<span class="new">NEW</span>' : '') + '</p><h1>' + esc(n.title) + '</h1><p class="lead">' + esc(n.lead) + '</p>' + window.triNewsWhen(n) + '</article>';
  if (n.changes && n.changes.length) h += '<section class="block"><h2>変わったところ</h2><ul class="chg">' + n.changes.map(function(c){ return '<li><em class="k-' + c[0] + '">' + KIND[c[0]] + '</em><span>' + esc(c[1]) + '</span></li>'; }).join('') + '</ul></section>';
  if (n.check && n.check.length) h += '<section class="block"><h2>確認してほしいところ</h2><ul class="chk">' + n.check.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></section>';
  if (n.links && n.links.length) h += '<section class="block"><h2>変わったページへ</h2><ul class="links">' + n.links.map(function(l){
    return '<li><a href="' + esc('../' + l[2]) + '"' + (/\.md$/.test(l[2]) ? ' download' : '') + '><em class="k-' + l[0] + '">' + KIND[l[0]] + '</em><span>' + esc(l[1]) + (l[3] ? '<small>' + esc(l[3]) + '</small>' : '') + '</span><i aria-hidden="true">→</i></a></li>';
  }).join('') + '</ul></section>';
  var newer = list[i - 1], older = list[i + 1];
  function pg(m, cls, label){ return m ? '<a class="' + cls + '" href="v.html?id=' + encodeURIComponent(m.id) + '"><small>' + label + '</small>' + esc((m.ver ? m.ver + ' ' : '') + m.title) + '</a>' : ''; }
  h += '<nav class="pager" aria-label="ほかの版">' + pg(older, 'pv', '← ひとつ前') + pg(newer, 'nx', 'ひとつ後 →') + '</nav>';
  box.insertAdjacentHTML('beforeend', h);
})();
</script>
</body>
</html>
