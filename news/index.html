<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TRIATHLONのお知らせと、キャラたちが共有する世界のニュース。">
<title>お知らせ・ニュース | TRIATHLON</title>
<link rel="stylesheet" href="news.css?v=world-1">
</head>
<body>
<script src="../site-nav.js?v=0.36"></script>
<main>
<header class="head"><p class="kicker">NEWS & UPDATES</p><h1>お知らせ・ニュース</h1></header>
<div class="news-tabs" role="tablist" aria-label="お知らせの種類"><button type="button" id="tab-notices" role="tab" aria-selected="true" aria-controls="panel-notices" tabindex="0">お知らせ</button><button type="button" id="tab-world" role="tab" aria-selected="false" aria-controls="panel-world" tabindex="-1">ニュース</button></div>
<section id="panel-notices" role="tabpanel" aria-labelledby="tab-notices">
<a class="rules" href="rules.html">アップデートの基準</a>
<section class="latest" id="latest" aria-label="最新の更新"></section>
<div class="filter" role="group" aria-label="種類で絞り込み"><button type="button" data-f="" aria-pressed="true">すべて</button><button type="button" data-f="update" aria-pressed="false">アップデート</button><button type="button" data-f="info" aria-pressed="false">お知らせ</button><button type="button" data-f="fix" aria-pressed="false">修正</button></div>
<ol class="list" id="list"></ol>
</section>
<section id="panel-world" role="tabpanel" aria-labelledby="tab-world" hidden>
<header class="world-head"><h2>世界のニュース</h2><p id="world-date"></p><p class="lead">キャラたちと共有する、世界の出来事。</p></header>
<div class="world-controls"><div class="filter" role="group" aria-label="ニュースの種類"><button type="button" data-world-filter="all" aria-pressed="true">すべて</button><button type="button" data-world-filter="voice" aria-pressed="false">キャラの声</button><button type="button" data-world-filter="change" aria-pressed="false">文明・暮らし</button></div><label>検索<input id="world-search" type="search" placeholder="人物・場所・出来事"></label><label>読む人<select id="world-reader"><option value="">ユーザー</option></select></label></div>
<p class="lead" id="world-reader-status" role="status"></p>
<ol class="world-list" id="world-list"></ol>
<p class="world-note">世界の変化は現在のルール式シミュレーションから集計しています。自律AIによる判断ではありません。キャラに共有されるのは、このタブのニュース本文だけです。</p>
</section>
</main>
<footer><a href="../">TRIATHLON トップ</a> / <a href="rules.html">アップデートの基準</a></footer>
<script src="news.js?v=0.36"></script>
<script src="../sim/world-sim.js?v=0.36"></script>
<script src="world-news.js?v=1"></script>
<script src="world-news-ui.js?v=1"></script>
<script>
(function () {
  'use strict';
  var CAT = {update:'アップデート', info:'お知らせ', fix:'修正'};
  var list = window.TRI_NEWS || [], filter = '';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function url(n){ return 'v.html?id=' + encodeURIComponent(n.id); }
  function meta(n, isNew){
    return '<p class="meta"><span class="cat c-' + n.cat + '">' + CAT[n.cat] + '</span>' + (n.ver ? '<span class="ver">' + esc(n.ver) + '</span>' : '') + window.triNewsTimes(n) + (isNew ? '<span class="new">NEW</span>' : '') + '</p>';
  }
  var newest = list[0];
  if (newest) document.getElementById('latest').innerHTML = meta(newest, true) + '<h2>' + esc(newest.title) + '</h2><p>' + esc(newest.lead) + '</p><a class="go" href="' + url(newest) + '">この版のページを開く →</a>';
  function render(){
    document.getElementById('list').innerHTML = list.slice(1).filter(function(n){ return !filter || n.cat === filter; }).map(function(n){
      return '<li><a class="card-link" href="' + url(n) + '">' + meta(n, false) + '<h2>' + esc(n.title) + '</h2><p>' + esc(n.lead) + '</p><span class="go">この版のページへ →</span></a></li>';
    }).join('') || '<li><p class="lead">この種類のお知らせはまだありません。</p></li>';
    document.querySelectorAll('[data-f]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.f === filter)); });
  }
  document.querySelector('.filter').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; render(); });
  render();
})();
</script>
</body>
</html>
