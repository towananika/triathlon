<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TRIATHLON のお知らせとアップデート。版ごとに1ページで、変更点と変わったページへのリンクをまとめています。">
<title>お知らせ・アップデート | TRIATHLON</title>
<link rel="stylesheet" href="news.css?v=0.24">
</head>
<body>
<script src="../site-nav.js?v=0.24-login-paused"></script>
<main>
<header class="head"><p class="kicker">NEWS & UPDATES</p><h1>お知らせ・アップデート</h1><p class="lead">版ごとに1ページ。押すと、その版で何が変わったかと、変わったページへのリンクが見られます。</p><a class="rules" href="rules.html">📏 アップデートの基準 →</a></header>
<section class="latest" id="latest" aria-label="最新の更新"></section>
<div class="filter" role="group" aria-label="種類で絞り込み"><button type="button" data-f="" aria-pressed="true">すべて</button><button type="button" data-f="update" aria-pressed="false">アップデート</button><button type="button" data-f="info" aria-pressed="false">お知らせ</button><button type="button" data-f="fix" aria-pressed="false">修正</button></div>
<ol class="list" id="list"></ol>
</main>
<footer><a href="../">TRIATHLON トップ</a> / <a href="rules.html">アップデートの基準</a></footer>
<script src="news.js?v=0.24.2"></script>
<script>
(function () {
  'use strict';
  var CAT = {update:'アップデート', info:'お知らせ', fix:'修正'};
  var list = window.TRI_NEWS || [], filter = '';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function url(n){ return 'v.html?id=' + encodeURIComponent(n.id); }
  function meta(n, isNew){
    return '<p class="meta"><span class="cat c-' + n.cat + '">' + CAT[n.cat] + '</span>' + (n.ver ? '<span class="ver">' + esc(n.ver) + '</span>' : '') + window.triNewsTimes(n) + (isNew ? '<span class="new">NEW</span>' : '') + '</p>';
  }
  var newest = list[0];
  if (newest) document.getElementById('latest').innerHTML = meta(newest, true) + '<h2>' + esc(newest.title) + '</h2><p>' + esc(newest.lead) + '</p><a class="go" href="' + url(newest) + '">この版のページを開く →</a>';
  function render(){
    document.getElementById('list').innerHTML = list.slice(1).filter(function(n){ return !filter || n.cat === filter; }).map(function(n){
      return '<li><a class="card-link" href="' + url(n) + '">' + meta(n, false) + '<h2>' + esc(n.title) + '</h2><p>' + esc(n.lead) + '</p><span class="go">この版のページへ →</span></a></li>';
    }).join('') || '<li><p class="lead">この種類のお知らせはまだありません。</p></li>';
    document.querySelectorAll('[data-f]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.f === filter)); });
  }
  document.querySelector('.filter').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; render(); });
  render();
})();
</script>
</body>
</html>
