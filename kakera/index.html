<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>光のかけら | TRIATHLON</title><meta property="og:type" content="website"><meta property="og:site_name" content="TRIATHLON 九つの光の、一生"><meta property="og:title" content="光のかけら | TRIATHLON"><meta property="og:description" content="物語を読んで選んだ心の光が、かけらになってたまる場所。"><meta property="og:url" content="https://towananika.github.io/triathlon/kakera/"><meta property="og:image" content="https://towananika.github.io/triathlon/assets/ogp.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="物語を読んで選んだ心の光が、かけらになってたまる場所。">
<style>
:root{--bg:#F3F6F5;--card:#FBFCFC;--fg:#26323A;--mute:#5f6f78;--line:#d9e3e2;--tq:#22AAA6;--blue:#2F6FB8;--deep:#173A63;--gold:#C9A646}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131B20;--card:#1B262C;--fg:#E3EBEA;--mute:#9fb0b4;--line:#2b3a42;--blue:#7fb0e8;--deep:#cfe0f2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131B20;--card:#1B262C;--fg:#E3EBEA;--mute:#9fb0b4;--line:#2b3a42;--blue:#7fb0e8;--deep:#cfe0f2;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.85 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0 0 4px;color:var(--blue)}.lead{color:var(--mute);margin:0 0 20px}
.forge{background:#1B262C;color:#E3EBEA;border-radius:20px;padding:22px 16px;display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:8px;align-items:end;text-align:center}
.jar b{display:block;font-size:26px;line-height:1.2}.jar small{color:#b8c4c8;font-size:13px}
.orb{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;filter:blur(.5px);opacity:.35}.on .orb{opacity:1;animation:p 3s ease-in-out infinite}
.white .orb{width:60px;height:60px;background:radial-gradient(circle,#FBFCFC,#DCF1EF 55%,transparent 72%)}
@keyframes p{50%{transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){.on .orb{animation:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0 0;color:var(--mute);font-size:15px}
h2{font-size:17px;color:var(--deep);margin:26px 0 10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}.log li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.log i{width:14px;height:14px;border-radius:50%;flex:none}.log a{color:var(--fg);text-decoration:none}
.empty{color:var(--mute)}.go a{color:var(--blue);font-weight:700}
@media (max-width:420px){.forge{grid-template-columns:repeat(3,1fr)}.white{grid-column:1/-1}}
</style></head><body>
<script src="../site-nav.js?v=0.55"></script>
<main>
<h1>光のかけら</h1>
<p class="lead">物語を読んで選んだ心の光が、かけらになって、ここの炉にたまります。</p>
<div class="forge" id="forge"></div>
<p class="how">赤・緑・青のかけらが1つずつそろうと、炉の中で白い光になります。どの色が多くても、少なくても、それがあなたの光の形です。</p>
<h2>これまでのかけら</h2>
<ul class="log" id="log"></ul>
<p class="go"><a href="../stories/">物語を読みにいく →</a></p>
</main>
<script src="../stories/stories.js?v=0.48"></script>
<script>
(function(){
  var LC={r:['#D9707A','赤'],g:['#4FAE84','緑'],b:['#5B8FD6','青']},K={};
  try{K=JSON.parse(localStorage.getItem('tri-kakera')||'{}')||{}}catch(e){}
  var c={r:0,g:0,b:0},S=window.TRI_STORIES||[];Object.keys(K).forEach(function(x){if(c[K[x]]!=null)c[K[x]]++});
  var w=Math.min(c.r,c.g,c.b);
  document.getElementById('forge').innerHTML=['r','g','b'].map(function(k){return '<div class="jar'+(c[k]?' on':'')+'"><div class="orb" style="background:radial-gradient(circle,'+LC[k][0]+',transparent 70%)"></div><b>'+c[k]+'</b><small>'+LC[k][1]+'</small></div>'}).join('')+
    '<div class="jar white'+(w?' on':'')+'"><div class="orb"></div><b>'+w+'</b><small>白い光</small></div>';
  var rows=S.filter(function(s){return K[s.id]}).map(function(s){var k=K[s.id];return '<li><i style="background:'+LC[k][0]+'"></i><a href="../stories/v.html?id='+s.id+'">第'+s.no+'話「'+s.title.replace(/[<>&]/g,'')+'」</a><span style="margin-left:auto;color:var(--mute);font-size:14px">'+LC[k][1]+'</span></li>'});
  document.getElementById('log').innerHTML=rows.length?rows.join(''):'<li class="empty">まだありません。話の最後で「いまの気持ちは何色？」を選ぶと、ここに届きます。</li>';
})();
</script></body></html>
