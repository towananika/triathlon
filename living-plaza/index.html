<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小さな広場 | TRIATHLON</title>
<style>
:root{color-scheme:light;--ink:#203b3c;--muted:#586e6d;--line:#cddcda;--teal:#087d7c;--paper:#f8fbfa}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#edf4f2;font:15px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}button,a{font:inherit}button{cursor:pointer}header{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(20px,calc((100% - 1120px)/2));background:#fff;border-bottom:1px solid var(--line)}header a{color:var(--ink);font-weight:700;text-decoration:none}header span{color:var(--muted);font-size:12px}main{max-width:1120px;margin:auto;padding:20px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0}p{margin:0}.sub{color:var(--muted);font-size:13px}.title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.day{color:var(--teal);font-weight:700;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr);gap:16px;align-items:start}.scene{position:relative;overflow:hidden;background:#dce9e7;aspect-ratio:16/10;border-radius:6px}.scene img{width:100%;height:100%;object-fit:cover;display:block}.scene-label{position:absolute;left:14px;bottom:14px;color:#fff;background:rgba(24,48,48,.78);padding:7px 12px;border-radius:4px;font-size:13px}.marker{position:absolute;right:18%;bottom:18%;background:#fff;color:var(--teal);border:2px solid var(--teal);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 12px #243a3a44}.panel{background:#fff;border:1px solid var(--line);padding:18px;border-radius:6px}.panel h2{margin-bottom:9px}.choices{display:grid;gap:8px}.choices button{min-height:46px;padding:9px 12px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px}.choices button[aria-pressed=true]{border:2px solid var(--teal);background:#e4f5f1}.event{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.event p{line-height:1.8}.event .name{font-weight:700;color:var(--teal);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action{border:0;border-radius:5px;background:var(--teal);color:white;padding:10px 15px;font-weight:700}.secondary{background:#fff;border:1px solid var(--line);color:var(--muted)}.history{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.history ul{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}.history li{font-size:13px;color:var(--muted)}.history li b{color:var(--ink)}.foot{margin-top:16px;color:var(--muted);font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid #dd9f45;outline-offset:3px}@media(max-width:720px){main{padding:16px}.layout{grid-template-columns:1fr}.scene{aspect-ratio:4/3}.panel{padding:16px}.title{align-items:start}.title h1{font-size:21px}}
</style>
</head>
<body>
<header><a href="../">TRIATHLON</a><span>小さな広場</span></header>
<main>
  <div class="title"><div><h1>小さな広場</h1><p class="sub">街の人たちと、今日をつくる。</p></div><span class="day" id="day"></span></div>
  <div class="layout">
    <div class="scene"><img src="plaza.png" alt="山と街並みが見える、冬の広場"><span id="marker" class="marker" hidden aria-hidden="true"></span><span class="scene-label" id="scene-label">まだ、何も選んでいない</span></div>
    <section class="panel" aria-label="広場の過ごし方">
      <h2>広場に置くもの</h2><div class="choices" id="choices"></div>
      <div class="event" aria-live="polite"><div style="display:flex;gap:12px;align-items:center"><img id="portrait" alt="" style="width:58px;height:58px;object-fit:cover;object-position:top;border-radius:50%;background:#e5efed"><div><p class="name" id="speaker">アカリ</p><p id="message"></p></div></div></div>
      <div class="actions"><button class="action" id="next" type="button">次の日へ</button><button class="action secondary" id="reset" type="button">最初から</button></div>
      <div class="history"><h2>広場の記録</h2><ul id="history"></ul></div>
      <p class="foot">試作：キャラの反応は決められたルールで動きます。記録はこの端末に保存されます。</p>
    </section>
  </div>
</main>
<script src="app.js?v=2"></script>
</body></html>
