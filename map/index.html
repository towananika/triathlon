<main>

  <label><input type="checkbox" id="ly-net" checked> 🛣️ 交通網</label><div class="legend"><span><i class="lg road"></i>道路</span><span><i class="lg rail"></i>鉄道</span><span><i class="lg sea"></i>航路</span><span><i class="lg colr"></i>開拓の航路</span><span>⚓ 港</span></div>

  <label><input type="checkbox" id="ly-use"> 🏭 土地の使い道（おもな仕事）</label><div class="legend"><span><i style="background:#8bc34a"></i>農業</span><span><i style="background:#29b6f6"></i>漁業</span><span><i style="background:#2e7d32"></i>林業</span><span><i style="background:#8d6e63"></i>採掘</span><span><i style="background:#5c6bc0"></i>工業</span><span><i style="background:#ff8a65"></i>商業</span></div>
  <b>重ねる</b><label><input type="checkbox" id="ly-prov" checked> 州の境界</label><label><input type="checkbox" id="ly-wx"> 今日の天気</label><label><input type="checkbox" id="ly-mood"> 暮らしの満足</label>
  <p>地形は本物の標高データ（Terrain Tiles：SRTM・ETOPO1 など。東アジアは約0.5km単位）。3つの国のほかは、まだだれも知らない土地です。🚩は開拓地、点線の輪は出会った文明です（世界シミュレーションで毎日ふえます）。国と州の広さ、町の位置は仮のものです。</p></div></div>
