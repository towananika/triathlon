<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>地図 | TRIATHLON</title><meta name="description" content="TRIATHLON の世界地図と、二水市の都市計画。"><style>
body{margin:0;background:#fbf8f2;color:#2a2622;font:15px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 56px}.kick{color:#9a7630;font-size:12px;margin:0}h1{font-size:28px;margin:4px 0 4px;line-height:1.4}h2{font-size:20px;margin:36px 0 6px}.meta{color:#7a6f63;font-size:14px;margin:0 0 16px}

.tools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.tools button,.zoom button{border:1px solid #d7cbb4;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:#2a2622;cursor:pointer}
.tools button[aria-pressed="true"]{background:#2a2622;color:#fff;border-color:#2a2622}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}.zoom button{width:38px;height:38px;padding:0;font-size:18px}

</style></head><body>
<script src="../site-nav.js?v=0.30"></script>
<main>
<p class="kick">MAP</p><h1>地図</h1>
<p class="meta">ゆびで回せる地球儀です。「平面」にすると、ふつうの世界地図になります。場所の名前を押すと、そこへ飛びます。</p>
<div class="wrap">
 <div class="stage" id="stage">
  <svg id="world" viewBox="0 0 600 600" role="img" aria-label="TRIATHLON の世界地図"></svg>
  <div class="tools" role="group" aria-label="地図の形"><button type="button" id="b-globe" aria-pressed="true">🌐 地球儀</button><button type="button" id="b-flat" aria-pressed="false">🗺️ 平面</button><button type="button" id="b-home">📍 二水へ</button></div>
  <div class="zoom"><button type="button" id="z-in" aria-label="大きく">＋</button><button type="button" id="z-out" aria-label="小さく">−</button></div>
 </div>
 <div class="side">
  <div class="box"><h3>場所</h3><ul class="plist" id="plist"></ul></div>
  <div class="box info" id="info"><p>場所を選ぶと、ここに説明が出ます。</p></div>
  <p class="note">3つの国のほかは、まだだれも知らない土地です。国の広さと町の位置は仮のものです。</p>
 </div>
</div>

<h2 id="nisui">二水市の都市計画</h2>
<p class="meta">水和国の首都・二水。二つの川が町を3つの区に分けます。色は土地の使い方、★はキャラの好きな場所です。</p>
<div class="city"><svg id="city" viewBox="0 0 360 290" role="img" aria-label="二水市の区・洞と土地の使い方"></svg>
<div class="legend" id="legend"></div></div>
<div class="ku" id="ku"></div>
</main>
<script src="../vendor/d3-7.9.0.min.js"></script>
<script src="../vendor/topojson-client-3.1.0.min.js"></script>
<script src="../assets/data/land-110m.js"></script>
<script>
(function(){
var PLACES=[
 {id:'nisui',name:'二水',sub:'水和国の首都',cls:'cap',ll:[126.98,37.57],n:'n1',text:'二つの川が出会う町。川守隊が町を守り、路面電車が走ります。物語の舞台です。',link:'#nisui',lt:'都市計画を見る'},
 {id:'meisan',name:'明山',sub:'文光国の首都',cls:'cap',ll:[128.05,38.62],n:'n2',text:'北の山の学園都市。学者たちが治め、灯石と光の研究をしています。'},
 {id:'hakko',name:'白港',sub:'改神国の首都',cls:'cap',ll:[130.4,33.6],n:'n3',text:'海のむこうの、白い石の港。祈りの鐘の音で一日が動きます。'}
];
var NATIONS=[
 {name:'水和国',n:'n1',c:[127.3,37.0],r:1.6,col:'#2f7d4a'},
 {name:'文光国',n:'n2',c:[127.9,39.4],r:1.3,col:'#4c56a8'},
 {name:'改神国',n:'n3',c:[132.5,34.0],r:2.6,col:'#a86412'}
];
var svg=d3.select('#world'),W=600,H=600,mode='globe',k=1.8;
var land=topojson.feature(window.triathlonLand,window.triathlonLand.objects.land);
var gl=d3.geoGraticule10();
var proj,path=d3.geoPath();
var rot=[-127,-36,0];
function base(){return mode==='globe'?290:96}
function makeProj(){
 proj=mode==='globe'?d3.geoOrthographic().clipAngle(90):d3.geoEquirectangular();
 proj.translate([W/2,H/2]).scale(base()*k);
 if(mode==='globe')proj.rotate(rot);else proj.rotate([rot[0],0,0]).center([0,-rot[1]]);
 path.projection(proj);
}
var gOcean=svg.append('path').attr('class','ocean'),gGrat=svg.append('path').attr('class','grat'),gLand=svg.append('path').attr('class','land'),gNat=svg.append('g'),gPin=svg.append('g'),gRim=svg.append('path').attr('class','rim');
function draw(){
 makeProj();
 svg.classed('flat',mode!=='globe');
 gOcean.attr('d',path({type:'Sphere'}));gRim.attr('d',path({type:'Sphere'}));
 gGrat.attr('d',path(gl));gLand.attr('d',path(land));
 var nat=gNat.selectAll('path').data(NATIONS);
 nat.enter().append('path').attr('class',function(d){return 'nation '+d.n}).merge(nat).attr('d',function(d){return path(d3.geoCircle().center(d.c).radius(d.r)())});
 var pin=gPin.selectAll('g').data(PLACES);
 var en=pin.enter().append('g').attr('class',function(d){return 'pin '+d.cls}).attr('tabindex',0).attr('role','button').attr('aria-label',function(d){return d.name}).on('click',function(e,d){go(d)}).on('keydown',function(e,d){if(e.key==='Enter')go(d)});
 en.append('circle').attr('r',7);en.append('text').attr('x',11).attr('y',6);
 en.merge(pin).each(function(d){
  var vis=mode!=='globe'||d3.geoDistance(d.ll,[-rot[0],-rot[1]])<Math.PI/2;
  var p=proj(d.ll),g=d3.select(this);
  g.style('display',vis&&p?null:'none');if(!p)return;
  g.attr('transform','translate('+p[0]+','+p[1]+')');g.select('text').text(d.name);
 });
}
function info(d){var el=document.getElementById('info');el.innerHTML='<h3>'+d.name+'<small style="font-weight:400;color:#7a6f63;margin-left:6px">'+d.sub+'</small></h3><p>'+d.text+'</p>'+(d.link?'<p style="margin-top:6px"><a href="'+d.link+'">'+d.lt+' →</a></p>':'');}
var anim;
function go(d,zoom){info(d);var from=rot.slice(),to=[-d.ll[0],-d.ll[1],0],k0=k,k1=zoom||Math.max(k,6);
 if(anim)anim.stop();anim=d3.timer(function(t){var s=Math.min(1,t/900),e=d3.easeCubicInOut(s);rot=d3.interpolate(from,to)(e);k=k0+(k1-k0)*e;draw();if(s>=1)anim.stop();});}
// 回す・ずらす
var start,r0;
svg.call(d3.drag().on('start',function(e){if(anim)anim.stop();start=[e.x,e.y];r0=rot.slice();}).on('drag',function(e){
 var f=mode==='globe'?0.25/k:0.6/k;rot=[r0[0]+(e.x-start[0])*f,Math.max(-85,Math.min(85,r0[1]-(e.y-start[1])*f)),0];draw();}));
function zoomBy(f){k=Math.max(0.8,Math.min(24,k*f));draw();}
svg.on('wheel',function(e){e.preventDefault();zoomBy(e.deltaY<0?1.15:1/1.15)},{passive:false});
// ピンチ
var pts={},pd=0;var el=svg.node();
el.addEventListener('touchstart',function(e){if(e.touches.length===2){pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});
el.addEventListener('touchmove',function(e){if(e.touches.length===2&&pd){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoomBy(d/pd);pd=d;}},{passive:true});
document.getElementById('z-in').onclick=function(){zoomBy(1.5)};document.getElementById('z-out').onclick=function(){zoomBy(1/1.5)};
function setMode(m){mode=m;document.getElementById('b-globe').setAttribute('aria-pressed',m==='globe');document.getElementById('b-flat').setAttribute('aria-pressed',m!=='globe');draw();}
document.getElementById('b-globe').onclick=function(){setMode('globe')};document.getElementById('b-flat').onclick=function(){setMode('flat')};
document.getElementById('b-home').onclick=function(){go(PLACES[0],8)};
document.getElementById('plist').innerHTML=PLACES.map(function(d,i){var n=NATIONS.filter(function(x){return x.n===d.n})[0];return '<li><button type="button" data-i="'+i+'"><b><span class="dot" style="background:'+n.col+'"></span>'+d.name+'</b><small>'+d.sub+'</small></button></li>'}).join('');
document.getElementById('plist').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(PLACES[+b.dataset.i]);});
draw();
})();

// 二水市の都市計画
(function(){

var D=[['岬口洞',96,150,'c1','green','灯台館がある合流点の岬。物語の中心。公園として残す'],['文山洞',150,62,'c1','edu','二水学園（中等部・高等部）と寮、図書館、演習場'],['森下洞',50,46,'c1','green','北の森のふもとの静かな住宅地。森は開発しない'],
['松原洞',266,50,'c2','home','九条家の屋敷など古い家が並ぶ高台'],['中路洞',236,104,'c2','shop','路面電車が走る通学の通り。商店も少し'],['川守洞',196,142,'c2','gov','川守隊の詰所と見張り台。町の役所もここ'],
['渡口洞',150,206,'c3','port','渡し場。船頭マツの渡し舟が出る'],['白石洞',100,200,'c3','build','大橋の南のたもと。いまは工事中'],['米市洞',214,238,'c3','shop','市場通り。焼きそばパンの店、裏路地の駄菓子屋'],['工房洞',300,196,'c3','work','灯石の道具を作る工房街。Towaのアトリエ'],['川尾洞',330,262,'c3','port','倉庫と船着き場。舟を待つ人の古い茶屋']];
var FAV=[['アカリ','akari',150,206],['シオン','shion',266,50],['ツバサ','tsubasa',236,104],['シズク','shizuku',50,46],['カイ','kai',150,62],['ミナト','minato',214,238],['リク','riku',150,62],['ルイ','rui',150,62],['セイラ','seira',330,262]];
var s='<path d="M0 0H222L182 110L128 160L0 150Z" fill="#dcebe0"/><path d="M222 0H360V124L160 156L190 100Z" fill="#e3e4f3"/><path d="M0 160L360 136V290H0Z" fill="#f4e8d6"/>';
D.forEach(function(p){s+='<circle cx="'+p[1]+'" cy="'+p[2]+'" r="24" fill="'+USE[p[4]][1]+'" opacity=".45"/>'});
s+='<path d="M360 120Q300 130 250 140Q190 150 120 160Q60 168 0 150V185Q60 195 120 182Q190 172 250 170Q310 165 360 160Z" fill="#8fcbd6"/><path d="M210 0Q190 60 170 110Q150 150 120 165L140 176Q175 150 195 115Q220 60 240 0Z" fill="#8fcbd6"/>';
s+='<g font-size="9" fill="#2a6f7d" opacity=".9"><text x="318" y="152">東の川</text><text x="6" y="174">二水川</text><text x="214" y="22" transform="rotate(-70 214 22)">北の川</text></g>';
// 路面電車・大橋・渡し
s+='<path d="M266 50L236 104L196 142L176 186L214 238L300 196" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 3"/>';
s+='<path d="M196 150L176 180" stroke="#5a5048" stroke-width="5" stroke-linecap="round"/><path d="M150 200Q120 178 100 156" fill="none" stroke="#2a6f7d" stroke-width="1.6" stroke-dasharray="2 3"/>';
s+='<g font-size="14" font-weight="800" opacity=".85"><text x="40" y="112" fill="#2f7d4a">西岸区</text><text x="282" y="92" fill="#4c56a8">中洲区</text><text x="20" y="278" fill="#a86412">南岸区</text></g>';
D.forEach(function(p){var r=p[1]>310;s+='<circle cx="'+p[1]+'" cy="'+p[2]+'" r="3.5" fill="#2a2622"/><text x="'+(p[1]+(r?-6:6))+'" y="'+(p[2]+4)+'"'+(r?' text-anchor="end"':'')+' font-size="10" font-weight="700" fill="#2a2622" style="paint-order:stroke;stroke:#fff;stroke-width:3px">'+p[0]+'</text>'});
var seen={};FAV.forEach(function(f){var key=f[2]+','+f[3],n=seen[key]=(seen[key]||0)+1,x=f[2]-10+(n-1)*9,y=f[3]-12;s+='<a href="../places/#'+f[1]+'"><text x="'+x+'" y="'+y+'" font-size="11" fill="#d4a017" style="paint-order:stroke;stroke:#fff;stroke-width:2px"><title>'+f[0]+'の好きな場所</title>★</text></a>'});
s+='<g transform="translate(96,150)"><path d="M0 -7L4 5H-4Z" fill="#9a7630"/></g><g transform="translate(300,196)"><path d="M0 -6L5 0L0 6L-5 0Z" fill="#9a7630"/></g>';
document.getElementById('city').innerHTML=s;
var lg='';for(var u in USE)lg+='<span><i style="background:'+USE[u][1]+'"></i>'+USE[u][0]+'</span>';
lg+='<span><i style="background:repeating-linear-gradient(90deg,#c0392b 0 6px,transparent 6px 9px);height:3px"></i>路面電車</span><span><i style="background:#5a5048;height:5px"></i>大橋</span><span>★ 好きな場所</span>';
document.getElementById('legend').innerHTML=lg;
var KU=[['西岸区','#2f7d4a','学びと森の区。町のはじまりの場所。','c1'],['中洲区','#4c56a8','屋敷町と電車通り、町を守る川守隊。','c2'],['南岸区','#a86412','市場と渡し場でにぎわう、職人と港の区。','c3']];
document.getElementById('ku').innerHTML=KU.map(function(k){return '<div class="k" style="--c:'+k[1]+'"><h3>'+k[0]+'</h3><p>'+k[2]+'</p><ul>'+D.filter(function(p){return p[3]===k[3]}).map(function(p){var u=USE[p[4]],f=FAV.filter(function(x){return x[2]===p[1]&&x[3]===p[2]});return '<li><b>'+p[0]+'</b><span class="tag" style="background:'+u[1]+'">'+u[0]+'</span><br>'+p[5]+(f.length?'<span class="fav"> ・ ★'+f.map(function(x){return '<a href="../places/#'+x[1]+'">'+x[0]+'</a>'}).join('、')+'</span>':'')+'</li>'}).join('')+'</ul></div>'}).join('');
})();
