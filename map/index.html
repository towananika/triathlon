 if(m==='plan'){setTimeout(function(){if(!box.classList.contains('plan'))return;prep();terrain();box.classList.add('relief');},30);}else box.classList.remove('relief');
 if(m!=='plan')prep();if(m==='terrain'&&!drawn.t){terrain();}if(m==='aerial')aerial();}

setMode('plan');

<script>
// 二水市：拡大・移動、名所の説明、動く車・路面電車・船・飛行機
(function(){
var box=document.querySelector('.cbox'),cin=document.getElementById('cin'),svg=document.getElementById('city'),info=document.getElementById('cinfo');
if(!box||!cin||!svg)return;
var NS='http://www.w3.org/2000/svg',z=1,tx=0,ty=0;
function clamp(){var w=box.clientWidth,h=box.clientHeight;tx=Math.min(0,Math.max(w-w*z,tx));ty=Math.min(0,Math.max(h-h*z,ty));}
function apply(){clamp();cin.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';box.classList.toggle('z2',z>=1.8);}
function zoomAt(nz,cx,cy){nz=Math.max(1,Math.min(5,nz));tx=cx-(cx-tx)*nz/z;ty=cy-(cy-ty)*nz/z;z=nz;apply();}
function mid(){return[box.clientWidth/2,box.clientHeight/2];}
document.getElementById('cz-in').onclick=function(){var m=mid();zoomAt(z*1.5,m[0],m[1])};
document.getElementById('cz-out').onclick=function(){var m=mid();zoomAt(z/1.5,m[0],m[1])};
document.getElementById('cz-0').onclick=function(){z=1;tx=ty=0;apply()};
box.addEventListener('wheel',function(e){e.preventDefault();var r=box.getBoundingClientRect();zoomAt(z*(e.deltaY<0?1.2:1/1.2),e.clientX-r.left,e.clientY-r.top)},{passive:false});
var pts={},last=null,pinch=null,moved=0;
box.addEventListener('pointerdown',function(e){if(e.target.closest('.czoom'))return;pts[e.pointerId]=[e.clientX,e.clientY];moved=0;var k=Object.keys(pts);
 if(k.length===2){var a=pts[k[0]],b=pts[k[1]];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:z};}else last=[e.clientX,e.clientY];});
box.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]=[e.clientX,e.clientY];var k=Object.keys(pts),r=box.getBoundingClientRect();
 if(k.length===2&&pinch){var a=pts[k[0]],b=pts[k[1]];zoomAt(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);moved=9;}
 else if(last){var dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){box.setPointerCapture&&box.setPointerCapture(e.pointerId);box.classList.add('drag');}tx+=dx;ty+=dy;last=[e.clientX,e.clientY];apply();}});
function up(e){delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=null;last=null;box.classList.remove('drag');}
box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
// ドラッグのあとはリンクを開かない
box.addEventListener('click',function(e){if(moved>4){e.preventDefault();e.stopPropagation();}},true);
window.addEventListener('resize',apply);
// 名所の説明
var LM=window.TRI_LM||[];
function show(g){var m=LM[+g.getAttribute('data-i')];if(!m)return;info.innerHTML='<b>'+m[3]+' '+m[0]+'</b><br>'+m[4];
 svg.querySelectorAll('#marks .lm circle:first-child').forEach(function(c){c.setAttribute('fill','#fff')});g.querySelector('circle').setAttribute('fill','#ffd34d');}
svg.addEventListener('click',function(e){var g=e.target.closest('.lm');if(g)show(g)});
svg.addEventListener('keydown',function(e){var g=e.target.closest('.lm');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(g)}});
// 動くもの
var mv=document.getElementById('moving');if(!mv)return;
function route(d){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','none');mv.appendChild(p);return p;}
function el(h){var g=document.createElementNS(NS,'g');g.innerHTML=h;mv.appendChild(g);return g;}
var COL=['#e74c3c','#f1c40f','#3498db','#ecf0f1','#2ecc71','#34495e','#e67e22'],V=[];
// 車：大きい道を行ったり来たり
['M20 62L150 62L96 148','M60 214L150 206L214 238L300 196L345 262','M266 50L236 104L196 142','M0 142Q60 152 96 150','M300 196L330 150','M150 62L176 92L196 96L236 104'].forEach(function(d,i){var p=route(d);
 for(var j=0;j<3;j++)V.push({p:p,sp:9+((i+j)%3)*2,o:(i*37+j*61)%100/100,pp:1,off:j%2?1.3:-1.3,g:el('<rect class="car" x="-2" y="-1.1" width="4" height="2.2" rx=".6" fill="'+COL[(i*3+j)%7]+'" stroke="#2a2622" stroke-width=".3"/>')});});
// 路面電車
var tp=route('M266 50L236 104L196 142L176 186L214 238L300 196');
[0,.5].forEach(function(o){V.push({p:tp,sp:6,o:o,pp:1,off:0,g:el('<rect x="-4.5" y="-1.6" width="9" height="3.2" rx="1" fill="#c0392b" stroke="#fff" stroke-width=".5"/><rect x="-3.5" y="-.8" width="7" height="1.2" fill="#fde9c8"/>')});});
// 渡し舟（マツの舟）と川の船
var fp=route('M150 200Q120 178 100 156');
V.push({p:fp,sp:2.5,o:0,pp:1,off:0,g:el('<path d="M-3.5 -1.3H3.5L2.4 1.3H-2.4Z" fill="#8b5a2b" stroke="#fff" stroke-width=".3"/><circle cx="0" cy="-1.8" r=".8" fill="#2a2622"/>')});
var r1=route('M360 140Q300 148 250 155Q190 162 120 171Q60 180 0 167'),r2=route('M225 0Q205 60 183 112Q162 150 130 170');
[[r1,3.5,.1],[r1,3,.6],[r2,2.8,.3]].forEach(function(b){V.push({p:b[0],sp:b[1],o:b[2],pp:1,off:0,wake:1,g:el('<path d="M-9 -1.6L-4 0L-9 1.6" fill="none" stroke="#fff" stroke-width=".5" opacity=".7"/><path d="M-4 -1.8H3L5 0L3 1.8H-4Z" fill="#f4f1e8" stroke="#3a4b5a" stroke-width=".4"/><rect x="-2.5" y="-1" width="3" height="2" fill="#7a8b99"/>')});});
// 飛行機：空の上をまっすぐ通る（影つき）
var A=[['M-30 300L390 -20',40,0],['M390 230L-30 40',34,.5]];
A.forEach(function(a){var p=route(a[0]);V.push({p:p,sp:a[1],o:a[2],pp:0,off:0,air:1,g:el('<g opacity=".25" transform="translate(6,8)"><path d="M6 0L-4 -1L-6 -6H-8L-6 -1H-9L-10 -3H-11L-10 0L-11 3H-10L-9 1H-6L-8 6H-6L-4 1Z" fill="#000"/></g><path d="M6 0L-4 -1L-6 -6H-8L-6 -1H-9L-10 -3H-11L-10 0L-11 3H-10L-9 1H-6L-8 6H-6L-4 1Z" fill="#fff" stroke="#3a4b5a" stroke-width=".5"/>')});});
V.forEach(function(v){v.L=v.p.getTotalLength();});
var run=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),t0=null,T=0,raf=0;
function frame(ts){if(t0==null)t0=ts;T+=Math.min(.1,(ts-t0)/1000);t0=ts;
 V.forEach(function(v){var cyc=v.air?v.L+600:v.L,dist=(v.o*cyc*(v.pp?2:1)+T*v.sp)%(cyc*(v.pp?2:1)),back=v.pp&&dist>v.L,s=back?2*v.L-dist:dist;
  if(v.air&&s>v.L){v.g.setAttribute('visibility','hidden');return;}v.g.removeAttribute('visibility');s=Math.max(0,Math.min(v.L,s));
  var a=v.p.getPointAtLength(s),b=v.p.getPointAtLength(Math.min(v.L,s+.5)),c=v.p.getPointAtLength(Math.max(0,s-.5)),ang=Math.atan2(b.y-c.y,b.x-c.x)+(back?Math.PI:0),
   ox=-Math.sin(ang)*v.off,oy=Math.cos(ang)*v.off;
  v.g.setAttribute('transform','translate('+(a.x+ox).toFixed(2)+','+(a.y+oy).toFixed(2)+') rotate('+(ang*180/Math.PI).toFixed(1)+')');});
 if(run)raf=requestAnimationFrame(frame);}
frame(0);t0=null;if(run)raf=requestAnimationFrame(frame);
var mb=document.getElementById('c-move');
function setRun(r){run=r;mb.textContent=r?'⏸':'▶';mb.setAttribute('aria-pressed',String(r));mb.setAttribute('aria-label',r?'動きを止める':'動かす');cancelAnimationFrame(raf);t0=null;if(r)raf=requestAnimationFrame(frame);}
mb.onclick=function(){setRun(!run)};setRun(run);
document.addEventListener('visibilitychange',function(){cancelAnimationFrame(raf);t0=null;if(run&&!document.hidden)raf=requestAnimationFrame(frame);});
})();
</script>
