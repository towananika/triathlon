<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ログイン | TRIATHLON</title><script src="../site-nav.js?v=0.41" defer></script><script type="module" src="auth.js?v=0.28"></script><script src="../login/portal.js?v=0.27.7" defer></script><style>body{margin:0;background:#f5f9f8;color:#163744;font:16px/1.8 system-ui,sans-serif}main{max-width:520px;margin:60px auto;padding:24px}h1{font-size:26px}a{color:#007f87}.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin:20px 0 8px;border:1px solid #cbdedf;border-radius:999px;background:#fff;color:#163744;font:700 16px system-ui,sans-serif;cursor:pointer}.gbtn:hover{background:#f1f7f7}.abtn{background:#000;color:#fff;border-color:#000;margin:8px 0 0}.gbtn.gpt{margin:8px 0 0;text-decoration:none;background:#10a37f;border-color:#10a37f;color:#fff}.gbtn.gpt:hover{background:#0e8f6f}.abtn:hover{background:#222}.abtn:disabled{background:#e4e8ea;border-color:#e4e8ea;color:#8a979c;cursor:not-allowed}.anote{margin:4px 0 0;text-align:center;font-size:13px;color:#6b7d83}.me{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #cbdedf;border-radius:14px;background:#fff;margin:20px 0 8px}.me img{width:44px;height:44px;border-radius:50%}.me b{display:block}.out{margin-left:auto;border:1px solid #cbdedf;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:600 14px system-ui,sans-serif;color:#163744}.err{color:#b3261e;font-size:14px}.ok{color:#1e7a46;font-size:14px}.or{display:flex;align-items:center;gap:10px;margin:22px 0 10px;color:#6b7d83;font-size:13px}.or:before,.or:after{content:"";flex:1;border-top:1px solid #cbdedf}.mform label[hidden]{display:none}.mform label{display:block;font-size:14px;font-weight:600;margin:8px 0}.mform input{display:block;box-sizing:border-box;width:100%;min-height:46px;margin-top:4px;padding:0 14px;border:1px solid #cbdedf;border-radius:10px;font:16px system-ui,sans-serif;color:#163744;background:#fff}.mform input:focus{outline:3px solid #c27600;outline-offset:1px}.mbtn{background:#163744;border-color:#163744;color:#fff;margin-top:12px}.mbtn:hover{background:#244b5a}.mlinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:6px 0 0}.mlinks button{background:none;border:0;padding:6px 0;color:#007f87;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:underline}.sub{margin-top:36px;padding-top:16px;border-top:1px solid #cbdedf;font-size:14px}.sub h2{font-size:15px;margin:0}.login{display:block;background:#007f87;color:white;padding:14px;text-align:center;border-radius:6px;margin:24px 0}a:focus-visible{outline:3px solid #c27600;outline-offset:3px}</style></head><body data-development-target="/dev/"><main><h1>ログイン</h1><p>Google・ChatGPT・メールアドレスでログインできます。</p><div id="g-out"><button class="gbtn" id="g-login" type="button"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Googleでログイン</button><div id="login-entry"></div><button class="gbtn abtn" id="a-login" type="button" disabled aria-describedby="a-note"><svg width="18" height="20" viewBox="0 0 17 20" aria-hidden="true"><path fill="currentColor" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg><span id="a-label">Appleでログイン</span></button><p class="anote" id="a-note">Appleでのログインには対応していません</p>
<div class="or"><span>またはメールで</span></div>
<form id="m-form" class="mform" novalidate>
<label id="m-name-row" hidden>名前<input id="m-name" autocomplete="nickname" maxlength="20"></label>
<label>メールアドレス<input id="m-mail" type="email" autocomplete="email" required></label>
<label>パスワード（6文字以上）<input id="m-pass" type="password" autocomplete="current-password" minlength="6" required></label>
<button class="gbtn mbtn" id="m-go" type="submit">メールでログイン</button>
<p class="mlinks"><button type="button" id="m-toggle">はじめての方：新しく登録</button><button type="button" id="m-reset">パスワードを忘れた</button></p>
</form></div><div id="g-in" hidden><div class="me"><img id="g-photo" alt="" referrerpolicy="no-referrer"><div><b id="g-name"></b><small id="g-mail"></small></div><button class="out" id="g-logout" type="button">ログアウト</button></div><p>ログインしています。</p><p class="note-links" style="font-size:14px">管理者の方：<a href="../admin/">管理ページ</a>・<a href="../dev/">開発ページ</a></p></div><p class="err" id="g-err" role="alert"></p><p><a href="https://towananika.github.io/triathlon/">公式サイトへ戻る</a></p></main><script>
(function(){
  var out=document.getElementById('g-out'),inn=document.getElementById('g-in'),err=document.getElementById('g-err');
  function show(u){out.hidden=!!u;inn.hidden=!u;if(u){document.getElementById('g-name').textContent=u.name;document.getElementById('g-mail').textContent=u.email;var im=document.getElementById('g-photo');if(u.photo)im.src=u.photo;else im.hidden=true;}}
  document.addEventListener('tri-user',function(e){show(e.detail)});
  function go(kind){err.textContent='';if(!window.triLogin){err.textContent='読みこみ中です。少し待ってからもう一度押してください。';return}window.triLogin(kind).catch(function(e){err.textContent='ログインできませんでした（'+(e&&e.code||'エラー')+'）。';});}
  document.getElementById('g-login').onclick=function(){go('google')};document.getElementById('a-login').onclick=function(){go('apple')};
  fetch('config.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(c){if(c&&c.apple===true){document.getElementById('a-login').disabled=false;document.getElementById('a-note').hidden=true}}).catch(function(){});
  var JA={'auth/invalid-email':'メールアドレスの形がちがいます。','auth/missing-password':'パスワードを入れてください。','auth/weak-password':'パスワードは6文字以上にしてください。','auth/email-already-in-use':'このメールアドレスはもう登録されています。「ログイン」に切り替えてください。','auth/invalid-credential':'メールアドレスかパスワードがちがいます。','auth/wrong-password':'メールアドレスかパスワードがちがいます。','auth/user-not-found':'このメールアドレスは登録されていません。','auth/too-many-requests':'何度も失敗したので、少し時間をおいてください。','auth/operation-not-allowed':'メールでのログインはまだ準備中です。'};
  function msg(e){return JA[e&&e.code]||('ログインできませんでした（'+(e&&e.code||'エラー')+'）。');}
  var signup=false,f=document.getElementById('m-form'),ok=document.createElement('p');ok.className='ok';ok.setAttribute('role','status');f.appendChild(ok);
  function mode(){document.getElementById('m-name-row').hidden=!signup;document.getElementById('m-go').textContent=signup?'メールで登録する':'メールでログイン';document.getElementById('m-toggle').textContent=signup?'登録ずみの方：ログイン':'はじめての方：新しく登録';document.getElementById('m-pass').autocomplete=signup?'new-password':'current-password';}
  document.getElementById('m-toggle').onclick=function(){signup=!signup;err.textContent='';ok.textContent='';mode();};
  f.onsubmit=function(ev){ev.preventDefault();err.textContent='';ok.textContent='';
    if(!window.triMailLogin){err.textContent='読みこみ中です。少し待ってからもう一度押してください。';return}
    var m=document.getElementById('m-mail').value.trim(),pw=document.getElementById('m-pass').value,nm=document.getElementById('m-name').value.trim();
    (signup?window.triMailSignup(m,pw,nm):window.triMailLogin(m,pw)).then(function(){f.reset();}).catch(function(e){err.textContent=msg(e);});};
  document.getElementById('m-reset').onclick=function(){err.textContent='';ok.textContent='';var m=document.getElementById('m-mail').value.trim();
    if(!m){err.textContent='上にメールアドレスを入れてから押してください。';return}
    if(!window.triMailReset){err.textContent='読みこみ中です。';return}
    window.triMailReset(m).then(function(){ok.textContent=m+' に、パスワードを決めなおすメールを送りました。';}).catch(function(e){err.textContent=msg(e);});};
  document.getElementById('g-logout').onclick=function(){window.triLogout&&window.triLogout()};
})();
</script></body></html>
