<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>管理者ログイン | TRIATHLON</title>
<script src="../tri-admin.js?v=0.19"></script>
<link rel="stylesheet" href="../news/news.css?v=0.19">
<style>
.box{background:#fff;border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:16px;padding:18px;display:grid;gap:12px}
.box h2{margin:0;font-size:20px}
label{font-size:13px;font-weight:700;display:grid;gap:6px}
input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%}
.btn{font:inherit;font-weight:800;border:0;border-radius:99px;padding:12px 20px;background:var(--teal);color:#fff;cursor:pointer;justify-self:start;text-decoration:none;display:inline-block}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line)}
.msg{margin:0;font-size:14px;min-height:1.4em}.msg.err{color:#b3261e}.msg.ok{color:var(--teal)}
.mark{font:12px/1.5 ui-monospace,monospace;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px}
.note{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>
<script src="../site-nav.js?v=0.21"></script>
<main>
<header class="head"><p class="kicker">ADMIN</p><h1>管理者ログイン</h1><p class="lead">ログインすると、開発版のページ（キャラ編集など）が見られます。</p></header>
<section class="box" id="out" hidden>
<label>合言葉<input id="phrase" type="password" autocomplete="current-password"></label>
<button class="btn" id="go" type="button">ログイン</button>
<p class="msg" id="msg" role="status"></p>
</section>
<section class="box" id="in" hidden>
<h2>ログイン中</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="../dev/">🛠️ 開発版へ</a><button class="btn sub" id="bye" type="button">ログアウト</button></div>
<div id="setup" hidden><p class="msg">まだ管理者の合言葉が登録されていないので、この端末だけ仮で入っています。下の「印」をチャットで Claude に送ると、登録されてどの端末でも使えるようになります（合言葉そのものは送らないでください）。</p><p class="mark" id="mark"></p><button class="btn sub" id="copy" type="button">印をコピー</button></div>
</section>
<p class="note">合言葉はどこにも送らず、この端末の中で確かめるだけのシンプルな仕組みです。</p>
</main>
<footer><a href="../">TRIATHLON トップ</a></footer>
<script>
(function () {
  'use strict';
  var A = window.TriAdmin, $ = function (i) { return document.getElementById(i); };
  function show() {
    var on = A.on();
    $('out').hidden = on; $('in').hidden = !on;
    $('setup').hidden = !(on && !A.ready());
    $('mark').textContent = A.mark();
  }
  $('go').onclick = function () {
    var p = $('phrase').value, m = $('msg');
    if (p.length < 8) { m.textContent = '合言葉は8文字以上です'; m.className = 'msg err'; return; }
    A.login(p).then(function (r) {
      if (!r.ok) { m.textContent = '合言葉がちがいます'; m.className = 'msg err'; return; }
      $('phrase').value = ''; m.textContent = ''; show();
    });
  };
  $('phrase').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  $('bye').onclick = function () { A.logout(); show(); $('msg').textContent = 'ログアウトしました'; $('msg').className = 'msg ok'; };
  $('copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(A.mark()).then(function () { $('copy').textContent = 'コピーしました'; }); };
  show();
})();
</script>
</body>
</html>
