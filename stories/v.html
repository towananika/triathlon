<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>物語 | TRIATHLON</title><meta property="og:type" content="website"><meta property="og:site_name" content="TRIATHLON 九つの光の、一生"><meta property="og:title" content="物語 | TRIATHLON"><meta property="og:description" content="二つの川の町・二水に生きる9人の一生を、まるごと見守る物語。"><meta property="og:url" content="https://towananika.github.io/triathlon/stories/v.html"><meta property="og:image" content="https://towananika.github.io/triathlon/assets/ogp.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><style>body{margin:0;background:#fbf8f2;color:#2a2622;font:16px/1.8 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:680px;margin:0 auto;padding:32px 20px 56px}.kick{color:#9a7630;font-size:12px;margin:0}h1{font-size:28px;margin:4px 0 6px;line-height:1.4}.meta{color:#7a6f63;font-size:14px;margin:0 0 24px}.lead{background:#fff;border:1px solid #eadfcd;border-radius:12px;padding:14px 16px;color:#5a5048}.body h2{font-size:18px;margin:40px 0 16px;color:#9a7630;letter-spacing:.08em}.body p{margin:0 0 1.1em;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;line-height:2.05}.body p.say{text-indent:0}.end{text-align:center;color:#7a6f63;margin-top:32px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:36px}.nav a{flex:1;text-align:center;border:1px solid #eadfcd;background:#fff;border-radius:999px;padding:10px;color:#2a2622;text-decoration:none;font-weight:700}.nav a.off{visibility:hidden}.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}.list a{display:block;background:#fff;border:1px solid #eadfcd;border-radius:14px;padding:16px;color:#2a2622;text-decoration:none}.list b{display:block;font-size:19px}.list small{color:#7a6f63}.list .no{color:#9a7630;font-weight:700;font-size:13px}.glow{position:relative;margin:28px 0;padding:18px 18px 16px 64px;border-radius:16px;background:#1B262C;color:#E3EBEA;overflow:hidden}.glow .orb{position:absolute;left:14px;top:18px;width:36px;height:36px;border-radius:50%;filter:blur(1px);animation:pulse 3.2s ease-in-out infinite}.glow .gt{font-size:12px;letter-spacing:.1em;color:#b8bfd6;margin:0 0 4px}.body .glow p.gx{margin:0;font-size:16px;line-height:1.95}.lights{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#7a6f63;margin:14px 0 0}.lights i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}@keyframes pulse{50%{transform:scale(1.18);opacity:.85}}@media (prefers-reduced-motion:reduce){.glow .orb{animation:none}}.pick{margin:36px 0 0;background:#fff;border:1px solid #eadfcd;border-radius:16px;padding:18px;text-align:center}.pick h2{font-size:17px;margin:0 0 12px;color:#2a2622}.pick .bt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pick button{border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;color:#FBFCFC;cursor:pointer}.pick button[aria-pressed="true"]{box-shadow:0 0 0 3px #fbf8f2,0 0 0 6px currentColor;outline:0}.pick button:focus-visible{outline:3px solid #C9A646;outline-offset:3px}.pick .rep{margin:14px 0 0;text-align:left;background:#1B262C;color:#E3EBEA;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.9}.pick .rep:empty{display:none}.pick small{display:block;margin-top:10px;color:#7a6f63;font-size:13px}.pick small a{color:#2F6FB8}.ask{margin:34px 0;border-left:4px solid #C9A646;background:#fff;border-radius:0 14px 14px 0;padding:14px 16px}.ask .aq{margin:0 0 10px;font-size:16px}.ask .aq b{color:#9a7630;margin-right:6px}.ab{display:flex;flex-wrap:wrap;gap:8px}.ab button{border:1px solid #22AAA6;background:#FBFCFC;color:#173A63;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}.ab button[aria-pressed="true"]{background:#22AAA6;color:#FBFCFC}.ab button:focus-visible{outline:3px solid #C9A646;outline-offset:2px}.body .ask p.ar{margin:12px 0 0;font-family:inherit;font-size:15px;line-height:1.9;color:#5a5048}.body .ask p.ar:empty{display:none}.tonote{margin:28px 0 0;text-align:center}.tonote a{display:inline-block;background:#DCF1EF;color:#173A63;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}.feel{margin:36px 0 0;background:#fff;border:1px solid #eadfcd;border-radius:14px;padding:14px 16px}.feel h2{font-size:15px;margin:0 0 8px;color:#9a7630}.feel p{margin:4px 0;font-size:15px;line-height:1.7}.feel b{display:inline-block;min-width:4em;color:#7a6f63;font-weight:700}.feel .fl{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}.feel .fl a{color:#1f6f78;font-weight:700;text-decoration:none}.lamp{margin:36px 0 0;background:#173A63;color:#E3EBEA;border-radius:16px;padding:18px;text-align:center}.lamp .lo{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;background:#2b4766;border:2px solid #4d6a88;transition:all 1.2s ease}.lamp.lit .lo{background:radial-gradient(#fff6d0,#C9A646 70%);border-color:#f3dc8a;box-shadow:0 0 22px 8px rgba(243,220,138,.55)}.lamp b{display:block;font-size:17px}.lamp small{display:block;color:#c9d6dc;margin:4px 0 10px}.lamp a{display:inline-block;background:#22AAA6;color:#FBFCFC;border-radius:999px;padding:8px 18px;font-weight:700;text-decoration:none}@media (prefers-reduced-motion:reduce){.lamp .lo{transition:none}}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap"></head><body>
<script src="../site-nav.js?v=0.65"></script>
<main id="m"><p>読みこみ中…</p></main>
<script src="stories.js?v=0.62"></script>
<script>
(function(){
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var NOTE={'2':['02','ツバサ'],'5':['03','カイ']};
  // キャラの問いかけ：話の途中で、語り手が読者に聞く。返事の中に、知っておくとよいことがまざっている
  var ASK={'1':['負けたあと、すぐもう一回やりたくなる？　それとも、ひと晩おきたい？',[['すぐ、もう一回','だよね！　でもね、からだは休んでいるあいだに強くなるんだって。だから、あたしも今夜はちゃんと寝る。くやしいのは、明日の朝に持っていく。'],['ひと晩おきたい','それ、いいと思う。からだは、休んでいるあいだに強くなるんだって。くやしい気持ちも、ひと晩ねると少し形が変わる。']]],
    '2':['だれかを好きになったら、すぐ言いたい？　それとも、しばらく自分の中に置いておきたい？',[['すぐ言いたい','まっすぐだね。言う前に、相手がいま聞ける時かどうかだけ見てあげて。好きって気持ちは、相手の気持ちと同じ重さで大事にするものだから。'],['しばらく置いておく','わたしも。言えない気持ちは、悪いものじゃない。でも苦しくなったら、信じられる人に話していい。気持ちに名前をつけるだけで、少し軽くなるから。']]],
    '3':['つかれたとき、ひとりで休みたい？　それとも、だれかのそばにいたい？',[['ひとりで休みたい','それでいいの。ひとりで休むのも、ちゃんとした手当て。眠る前に画面の光から少しはなれると、からだも休みやすくなるよ。'],['だれかのそばにいたい','わかる。だれかがそばにいると、息がゆっくりになるの。休むときに「いてもいい？」って聞けるのも、大事な力だよ。']]],
    '4':['家や名前に期待されたら、こたえたい？　それとも、自分の道を選びたい？',[['こたえたい','わたくしも、ずっとそうでした。こたえたい気持ちは、やさしさです。ただ、その中に自分の「やりたい」が一つは入っているか、ときどき確かめてみてください。'],['自分の道を選びたい','勇気がいりますね。家の人とちがう道を選んでも、つながりが切れるわけではありません。言葉にして伝えれば、いつか分かってもらえることもあります。']]],
    '5':['仲のいい人が近すぎるとき、言える？　それとも、がまんする？',[['言える','すごいな。俺は言えなかった。「近い」って言うのは、相手をきらうことじゃない。ちょうどいい距離を、いっしょに探すことだ。'],['がまんする','俺も、そうだった。でも、がまんが続くと、その人のことまで苦手になる。「ときどき近い」くらいの小さな声からでいい。']]]};
  var LC={r:['#D9707A','赤'],g:['#4FAE84','緑'],b:['#5B8FD6','青']};
  function glow(p){var m=p.slice(1).split('|'),k=m[0].split(','),c=k.map(function(x){return LC[x][0]});
    var bg=c.length>1?'radial-gradient(circle at 35% 35%,'+c[0]+',transparent 70%),radial-gradient(circle at 65% 65%,'+c[1]+',transparent 70%)':'radial-gradient(circle,'+c[0]+',transparent 70%)';
    return '<div class="glow"><span class="orb" style="background:'+bg+'"></span><p class="gt">心の光　'+k.map(function(x){return LC[x][1]}).join('と')+'</p><p class="gx">'+esc(m[1])+'</p></div>'}
  var all=window.TRI_STORIES||[],id=new URLSearchParams(location.search).get('id')||'1',i=all.findIndex(function(s){return s.id===id}),m=document.getElementById('m');
  var up=(window.TRI_STORIES_ALL||[]).filter(function(x){return x.id===id})[0];
  if(i<0&&up){m.innerHTML='<h1>第'+up.no+'話は '+up.date.slice(5).replace('-','月')+'日に公開します</h1><p><a href="./">物語の一覧へ</a></p>';return}
  if(i<0){m.innerHTML='<h1>見つかりませんでした</h1><p><a href="./">物語の一覧へ</a></p>';return}
  var s=all[i];document.title='第'+s.no+'話「'+s.title+'」 | TRIATHLON';
  var body=s.secs.map(function(c,ci){return (ci===1&&ASK[s.id]?askBox():'')+'<h2>'+esc(c.h)+'</h2>'+c.p.map(function(p){return /^◇/.test(p)?glow(p):'<p'+(/^「/.test(p)?' class="say"':'')+'>'+esc(p)+'</p>'}).join('')}).join('');
  function askBox(){var a=ASK[s.id];return '<section class="ask" aria-label="'+esc(s.who)+'からの問いかけ"><p class="aq"><b>'+esc(s.who)+'</b>「'+esc(a[0])+'」</p><div class="ab">'+a[1].map(function(o,j){return '<button type="button" data-j="'+j+'" aria-pressed="false">'+esc(o[0])+'</button>'}).join('')+'</div><p class="ar" id="ar" aria-live="polite"></p></section>'}
  // この話の手ざわり（場所・値段・感覚）と、地図への入り口
  var FEEL={'1':['渡口路の渡し場と、岬口路の灯台館','渡し舟は片道5文。朝の川は、魚と油のにおいがする。'],'2':['渡し場と、雨の灯台館','焼きそばパンは20文。雨の日の灯台館は、木とほこりのにおい。'],'3':['灯台館の台所','茶葉ひとつかみで10文。鍋の湯気で、窓が白くくもる。'],'4':['二水学園と、裏通りの祭り','祭りの串焼きは1本10文。太鼓の音が、お腹にひびく。'],'5':['学園の寮の二段ベッド','寮の部屋代は月6千文を二人で割る。夜は、となりの寝息が聞こえる。'],'6':['米市路・渡口路・川尾路','米屋の米は一升40文。川尾路は、網をほす日なたのにおい。']};
  function lampOn(){var R=[];try{R=JSON.parse(localStorage.getItem('tri-read')||'[]')}catch(e){}if(R.indexOf(s.id)<0){R.push(s.id);try{localStorage.setItem('tri-read',JSON.stringify(R))}catch(e){}}var A=window.TRI_STORIES_ALL||[],W={};A.forEach(function(x){if(R.indexOf(x.id)>=0)W[x.who]=1});var el=document.getElementById('lamp');el.classList.add('lit');document.getElementById('lamp-t').textContent=s.who+'の灯りがともりました';document.getElementById('lamp-n').textContent='あなたがともした灯り '+Object.keys(W).length+' / 9'}
  function feelBox(){var f=FEEL[s.id];return '<section class="feel"><h2>この話の手ざわり</h2>'+(f?'<p><b>場所</b>'+esc(f[0])+'</p><p><b>暮らし</b>'+esc(f[1])+'</p>':'')+'<p class="fl"><a href="../map/#nisui">二水の町をマップで見る →</a><a href="../map/#life='+encodeURIComponent(s.who)+'">'+esc(s.who)+'の一生をたどる →</a></p></section>'}
  function nav(j,t){return j>=0&&j<all.length?'<a href="v.html?id='+encodeURIComponent(all[j].id)+'">'+t+'</a>':'<a class="off">'+t+'</a>'}
  m.innerHTML='<p class="kick">第'+s.no+'話・'+esc(s.who)+'（'+esc(s.cls)+'）</p><h1>'+esc(s.title)+'</h1><p class="meta">'+esc(s.date.replace(/-/g,'.'))+' 公開</p><p class="lead">'+esc(s.lead)+'</p>'+(JSON.stringify(s).indexOf('◇')>=0?'<p class="lights"><span><i style="background:#D9707A"></i>赤＝からだの熱・ひかれる気持ち</span><span><i style="background:#4FAE84"></i>緑＝知りたい気持ち</span><span><i style="background:#5B8FD6"></i>青＝心の内側・不安や想像</span></p>':'')+'<div class="body">'+body+'</div>'+(NOTE[s.id]?'<p class="tonote"><a href="../notes/?id='+NOTE[s.id][0]+'">📒 '+esc(NOTE[s.id][1])+'のひみつのメモを読む →</a></p>':'')+'<section class="pick" aria-labelledby="pk-h"><h2 id="pk-h">読み終えて、いまの気持ちは何色？</h2><div class="bt">'+['r','g','b'].map(function(k){return '<button type="button" data-k="'+k+'" aria-pressed="false" style="background:'+LC[k][0]+'">'+LC[k][1]+'</button>'}).join('')+'</div><p class="rep" id="rep" aria-live="polite"></p><small id="pk-n"></small></section>'+feelBox()+'<section class="lamp" id="lamp"><div class="lo"></div><b id="lamp-t">読み終えると、'+esc(s.who)+'の灯りがともります</b><small id="lamp-n"></small><a href="../part1/">🏮 第1部の道のりを見る →</a></section><div class="nav">'+nav(i-1,'← 前の話')+'<a href="./">一覧</a>'+nav(i+1,'次の話 →')+'</div>';
  if(ASK[s.id]){var AA={};try{AA=JSON.parse(localStorage.getItem('tri-ask')||'{}')||{}}catch(e){}
    var ans=function(j){[].forEach.call(document.querySelectorAll('.ab button'),function(b){b.setAttribute('aria-pressed',+b.dataset.j===j)});document.getElementById('ar').textContent=j==null?'':ASK[s.id][1][j][1]};
    [].forEach.call(document.querySelectorAll('.ab button'),function(b){b.onclick=function(){AA[s.id]=+b.dataset.j;try{localStorage.setItem('tri-ask',JSON.stringify(AA))}catch(e){}ans(+b.dataset.j)}});
    if(AA[s.id]!=null)ans(AA[s.id]);}
  // 心の光を選ぶ：選んだ色は「光のかけら」になる（この端末にだけ残る）
  var RE={r:'赤なんだね。からだが先に熱くなったり、だれかにひかれたりする気持ち。それは、ちゃんと生きている光。',g:'緑なんだね。もっと知りたい、近づいてみたいという気持ち。その色は、次の一歩をつれてくる。',b:'青なんだね。心の内側で、不安になったり、あれこれ想像したりする気持ち。青があるから、人にやさしくなれる。'};
  var K={};try{K=JSON.parse(localStorage.getItem('tri-kakera')||'{}')||{}}catch(e){}
  function cnt(){var c={r:0,g:0,b:0};Object.keys(K).forEach(function(x){if(c[K[x]]!=null)c[K[x]]++});return c}
  function show(k,fresh){[].forEach.call(document.querySelectorAll('.pick button'),function(b){b.setAttribute('aria-pressed',b.dataset.k===k)});
    document.getElementById('rep').textContent=k?RE[k]+'　― '+s.who:'';
    var c=cnt(),w=Math.min(c.r,c.g,c.b);document.getElementById('pk-n').innerHTML=k?(fresh?'光のかけらが1つ増えました':'このかけらは、灯石工房の炉にとどいています')+'（赤 '+c.r+'・緑 '+c.g+'・青 '+c.b+(w?'・白い光 '+w:'')+'）。<a href="../kakera/">灯石工房でかけらを見る →</a>':'選んだ色は、光のかけらになります。'}
  [].forEach.call(document.querySelectorAll('.pick button'),function(b){b.onclick=function(){K[s.id]=b.dataset.k;try{localStorage.setItem('tri-kakera',JSON.stringify(K))}catch(e){}show(b.dataset.k,1)}});
  show(K[s.id]);
  // 灯り：最後まで読むと、語り手の灯りがともる（この端末にだけ残る）
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){io.disconnect();setTimeout(lampOn,300)}},{threshold:.6});io.observe(document.getElementById('lamp'))}else lampOn();
})();
</script></body></html>
