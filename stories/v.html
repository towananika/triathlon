<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>物語 | TRIATHLON</title><style>body{margin:0;background:#fbf8f2;color:#2a2622;font:16px/1.8 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:680px;margin:0 auto;padding:32px 20px 56px}.kick{color:#9a7630;font-size:12px;margin:0}h1{font-size:28px;margin:4px 0 6px;line-height:1.4}.meta{color:#7a6f63;font-size:14px;margin:0 0 24px}.lead{background:#fff;border:1px solid #eadfcd;border-radius:12px;padding:14px 16px;color:#5a5048}.body h2{font-size:18px;margin:40px 0 16px;color:#9a7630;letter-spacing:.08em}.body p{margin:0 0 1.1em;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;line-height:2.05}.body p.say{text-indent:0}.end{text-align:center;color:#7a6f63;margin-top:32px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:36px}.nav a{flex:1;text-align:center;border:1px solid #eadfcd;background:#fff;border-radius:999px;padding:10px;color:#2a2622;text-decoration:none;font-weight:700}.nav a.off{visibility:hidden}.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}.list a{display:block;background:#fff;border:1px solid #eadfcd;border-radius:14px;padding:16px;color:#2a2622;text-decoration:none}.list b{display:block;font-size:19px}.list small{color:#7a6f63}.list .no{color:#9a7630;font-weight:700;font-size:13px}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap"></head><body>
<script src="../site-nav.js?v=0.30"></script>
<main id="m"><p>読みこみ中…</p></main>
<script src="stories.js?v=0.28.1"></script>
<script>
(function(){
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var all=window.TRI_STORIES||[],id=new URLSearchParams(location.search).get('id')||'1',i=all.findIndex(function(s){return s.id===id}),m=document.getElementById('m');
  if(i<0){m.innerHTML='<h1>見つかりませんでした</h1><p><a href="./">物語の一覧へ</a></p>';return}
  var s=all[i];document.title='第'+s.no+'話「'+s.title+'」 | TRIATHLON';
  var body=s.secs.map(function(c){return '<h2>'+esc(c.h)+'</h2>'+c.p.map(function(p){return '<p'+(/^「/.test(p)?' class="say"':'')+'>'+esc(p)+'</p>'}).join('')}).join('');
  function nav(j,t){return j>=0&&j<all.length?'<a href="v.html?id='+encodeURIComponent(all[j].id)+'">'+t+'</a>':'<a class="off">'+t+'</a>'}
  m.innerHTML='<p class="kick">第'+s.no+'話・'+esc(s.who)+'（'+esc(s.cls)+'）</p><h1>'+esc(s.title)+'</h1><p class="meta">'+esc(s.date.replace(/-/g,'.'))+' 公開</p><p class="lead">'+esc(s.lead)+'</p><div class="body">'+body+'</div><div class="nav">'+nav(i-1,'← 前の話')+'<a href="./">一覧</a>'+nav(i+1,'次の話 →')+'</div>';
})();
</script></body></html>
