<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一生の地図 | TRIATHLON</title><meta name="description" content="9人の一生を、0歳から80歳までの線で見る。">
<style>
:root{--bg:#F3F6F5;--card:#FBFCFC;--fg:#26323A;--mute:#5f6f78;--line:#d9e3e2;--ghost:#c3cfcf;--tq:#22AAA6;--blue:#2F6FB8;--gold:#C9A646;--r:#D9707A;--g:#4FAE84;--b:#5B8FD6;--mist:#DCF1EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131B20;--card:#1B262C;--fg:#E3EBEA;--mute:#9fb0b4;--line:#2b3a42;--ghost:#3d4d55;--mist:#1f3a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131B20;--card:#1B262C;--fg:#E3EBEA;--mute:#9fb0b4;--line:#2b3a42;--ghost:#3d4d55;--mist:#1f3a3c;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0;color:var(--blue)}.lead{color:var(--mute);margin:4px 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px}
.age{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin:0 4px 8px}
.age input{flex:1;accent-color:var(--gold)}.age output{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:0 4px 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}svg text{font-family:inherit}
.dot{cursor:pointer}.dot:focus-visible circle{stroke:var(--gold);stroke-width:3}
.pop{position:sticky;top:8px;z-index:2;margin:0 0 8px;background:var(--mist);border-radius:14px;padding:10px 14px;font-size:14px;min-height:3.4em}
.pop b{display:block}.pop a{color:var(--blue);font-weight:700}
.memo{color:var(--mute);font-size:13px;margin-top:14px}
</style></head><body>
<script src="../site-nav.js?v=0.39"></script>
<main>
<h1>一生の地図</h1>
<p class="lead">9人の一生を、上から下へ。点は心の光の色。押すと、その時の話へ。</p>
<div class="box">
 <label class="age" for="age">あなたの年 <input id="age" type="range" min="0" max="80" value="40"><output id="ageOut">40歳</output></label>
 <div class="legend"><span><i style="background:var(--r)"></i>からだの熱・ひかれる</span><span><i style="background:var(--g)"></i>知りたい</span><span><i style="background:var(--b)"></i>心の内側・不安</span><span><i style="background:var(--tq)"></i>暮らし・仕事</span><span><i style="background:var(--ghost)"></i>まだ書かれていない</span></div>
 <div class="pop" id="pop" aria-live="polite"></div>
 <svg id="map" viewBox="0 0 360 540" role="img" aria-label="9人の0歳から80歳までの線と、できごとの点"></svg>
</div>
<p class="memo">9人は新暦297年ごろの生まれ。新暦312年に15歳で二水学園に入り、いま（新暦322年）は25歳です。あなたの年は、この端末にだけ残ります。</p>
</main>
<script>
(function(){
  var Y0=34,K=6,AGE=function(a){return Y0+a*K},COL={r:'var(--r)',g:'var(--g)',b:'var(--b)',w:'var(--tq)',x:'var(--ghost)'};
  // [年齢, 色, できごと, リンク]
  var JOB={'アカリ':'川守隊の隊員','シオン':'九条家の当主','ツバサ':'渡し舟の船頭','シズク':'北の森の森番','カイ':'灯台館の技師','ミナト':'開拓地への運び屋','リク':'学園の魔法の先生','ルイ':'学園図書館の司書','セイラ':'船着き場の茶屋の主人'};
  var EV={'アカリ':[[15,'r','川守隊の試験で、一発いった（第1話）','../stories/v.html?id=1'],[16.8,'b','ツバサに「ごめん」と言えた（第1話）','../stories/v.html?id=1']],
          'ツバサ':[[15,'b','砂の上の、青い光（第2話）','../stories/v.html?id=2'],[16.8,'r','舟の上で、知らない赤い光（第2話）','../stories/v.html?id=2']]};
  var CAST=Object.keys(JOB),svg=document.getElementById('map'),pop=document.getElementById('pop'),NS='http://www.w3.org/2000/svg';
  function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  [0,10,20,30,40,50,60,70,80].forEach(function(a){el('line',{x1:24,x2:356,y1:AGE(a),y2:AGE(a),stroke:'var(--line)'});el('text',{x:0,y:AGE(a)+4,'font-size':10,fill:'var(--mute)'}).textContent=a});
  var STG=[[0,12,2],[12,15,3],[15,30,6],[30,60,4],[60,80,3]];
  CAST.forEach(function(n,i){
    var x=46+i*36;
    el('text',{x:x,y:16,'font-size':11,'text-anchor':'middle',fill:'var(--fg)','font-weight':700}).textContent=n;
    STG.forEach(function(s){var lit=s[0]<=25;el('line',{x1:x,x2:x,y1:AGE(s[0]),y2:AGE(s[1]),stroke:lit?(s[0]>=15&&s[0]<30?'var(--r)':'var(--tq)'):'var(--line)','stroke-opacity':lit?.4:1,'stroke-width':s[2],'stroke-linecap':'round'})});
    var ev=[[15,'g','二水学園に入り、9人で灯台館の修理へ','../stories/']].concat(EV[n]||[]).concat([[25,'w','いま：'+JOB[n],'../sim/'],[35,'x','まだ書かれていない（2期で親に）',''],[60,'x','まだ書かれていない（4期で祖父母に）','']]);
    if(EV[n])ev.shift();
    ev.forEach(function(e){
      var g=el('g',{'class':'dot',tabindex:0,role:'button','aria-label':n+' '+Math.floor(e[0])+'歳 '+e[2]});
      el('circle',{cx:x,cy:AGE(e[0]),r:e[1]==='x'?4.5:6.5,fill:COL[e[1]],stroke:'var(--card)','stroke-width':2},g);
      function show(){pop.innerHTML='<b>'+esc(n)+'　'+Math.floor(e[0])+'歳</b>'+esc(e[2])+(e[3]?'　<a href="'+e[3]+'">読む・見る →</a>':'')}
      g.addEventListener('click',show);g.addEventListener('keydown',function(k){if(k.key==='Enter'||k.key===' '){k.preventDefault();show()}});
    });
  });
  var you=el('g',{});el('line',{x1:24,x2:356,y1:0,y2:0,stroke:'var(--gold)','stroke-width':2},you);var yt=el('text',{x:356,y:-4,'font-size':10,'text-anchor':'end',fill:'var(--gold)'},you);yt.textContent='あなた';
  var inp=document.getElementById('age'),out=document.getElementById('ageOut');
  function set(a){you.setAttribute('transform','translate(0 '+AGE(a)+')');out.textContent=a+'歳';
    pop.innerHTML=a<15?'<b>'+a+'歳のころ</b>9人はまだ子ども。ここはこれから、思い出の話で書かれます。':a<=25?'<b>'+a+'歳のころ</b>9人は二水学園から、それぞれの仕事へ。点を押すと話が出ます。':'<b>'+a+'歳のころ</b>9人の人生は、まだ書かれていません。あなたの今の年に、9人もいつか追いつきます。';
    try{localStorage.setItem('tri-life-age',a)}catch(e){}}
  var sv=40;try{var v=localStorage.getItem('tri-life-age');if(v!==null)sv=+v}catch(e){}
  inp.value=sv;set(sv);inp.addEventListener('input',function(){set(+inp.value)});
})();
</script></body></html>
