<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>管理 | TRIATHLON</title><style>body{margin:0;background:#f5f9f8;color:#163744;font:16px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:860px;margin:0 auto;padding:28px 16px 48px}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:26px 0 10px}.sub{color:#58717a;margin:0 0 16px}.gate-msg{background:#fff;border:1px solid #cbdedf;border-radius:14px;padding:18px}.gate-btn{display:inline-block;margin-top:12px;background:#007f87;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 22px}.box{background:#fff;border:1px solid #cbdedf;border-radius:14px;padding:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e3eeee;overflow-wrap:anywhere}th{color:#58717a;font-weight:600}textarea{box-sizing:border-box;width:100%;min-height:160px;border:1px solid #cbdedf;border-radius:10px;padding:10px;font:15px/1.7 system-ui,sans-serif;color:#163744}button{font:700 14px system-ui,sans-serif;border-radius:999px;border:1px solid #007f87;background:#007f87;color:#fff;padding:8px 18px;cursor:pointer}button.ghost{background:#fff;color:#007f87}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.note{font-size:13px;color:#58717a}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.links a{display:block;background:#fff;border:1px solid #cbdedf;border-radius:12px;padding:12px 14px;color:#163744;text-decoration:none;font-weight:700}.links a small{display:block;font-weight:400;color:#58717a}.tasks{list-style:none;margin:0;padding:0}.tasks li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e3eeee}.tasks li span{flex:1;overflow-wrap:anywhere}.tasks li.done span{text-decoration:line-through;color:#8a979c}.tasks input[type=checkbox]{width:20px;height:20px}.x{background:none;border:0;color:#8a979c;padding:4px 8px;font-size:18px}input.add{flex:1;min-width:0;min-height:42px;border:1px solid #cbdedf;border-radius:10px;padding:0 12px;font:15px system-ui,sans-serif}</style></head><body>
<script src="../site-nav.js?v=0.40"></script>
<main><h1>管理</h1><p class="sub">サイトの利用者と、管理者どうしのメモ。</p>
<div id="gate"></div>
<div id="admin-body" hidden>
<h2>利用者</h2><div class="box"><table><thead><tr><th>名前</th><th>メール</th><th>方法</th><th>最後に来た日</th></tr></thead><tbody id="users"><tr><td colspan="4">読みこみ中…</td></tr></tbody></table><p class="note" id="ucount"></p></div>
<h2>管理メモ</h2><div class="box"><textarea id="memo" placeholder="管理者どうしの連絡など"></textarea><div class="row"><button id="save" type="button">保存</button><span class="note" id="saved"></span></div></div>
<h2>ほかのページ</h2><div class="links"><a href="../dev/">開発ページ<small>開発タスクと開発用の道具</small></a><a href="../news/">お知らせ<small>公開しているアップデート</small></a></div>
</div></main>
<script>
window.triAdminReady = function (f) {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var VIA = { 'google.com': 'Google', 'password': 'メール' };
  f.getDocs(f.query(f.collection(f.db, 'users'), f.orderBy('last', 'desc'), f.limit(200))).then(function (s) {
    var rows = []; s.forEach(function (d) { var u = d.data(), t = u.last && u.last.toDate ? u.last.toDate() : null;
      rows.push('<tr><td>' + esc(u.name || '（名前なし）') + '</td><td>' + esc(u.email) + '</td><td>' + esc(VIA[u.via] || u.via) + '</td><td>' + (t ? t.getFullYear() + '.' + (t.getMonth() + 1) + '.' + t.getDate() : '') + '</td></tr>'); });
    document.getElementById('users').innerHTML = rows.join('') || '<tr><td colspan="4">まだいません</td></tr>';
    document.getElementById('ucount').textContent = rows.length + '人';
  }).catch(function (e) { document.getElementById('users').innerHTML = '<tr><td colspan="4">読めませんでした（' + esc(e.code) + '）</td></tr>'; });
  var memo = document.getElementById('memo'), ref = f.doc(f.db, 'admin', 'memo');
  f.getDoc(ref).then(function (d) { if (d.exists()) memo.value = d.data().text || ''; });
  document.getElementById('save').onclick = function () {
    f.setDoc(ref, { text: memo.value, at: f.serverTimestamp() }).then(function () { document.getElementById('saved').textContent = '保存しました'; })
      .catch(function (e) { document.getElementById('saved').textContent = '保存できませんでした（' + e.code + '）'; });
  };
};
</script>
<script src="../login/gate.js?v=0.28"></script>
</body></html>
