<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>文明シミュ（試作）</title>
<style>
/* 開発用：キャラ1人1人から文明が育つ試作（2026-11-07）。キャラはユーザーとAIがコントロール、または声で影響できる */
:root{--bg:#f1ece0;--card:#faf6ec;--fg:#3b362e;--mut:#6b6355;--line:#ddd3c0;--accent:#5d7f4e;--ainK:#faf6ec;--R:#c0645a;--G:#5d8f5e;--B:#4f6f9a;--W:#a99f8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 6px}p{margin:0}.mut{color:var(--mut);font-size:13px}
nav a{color:var(--B);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}

.btn.sub{background:var(--card);color:var(--fg);border:1px solid var(--line)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kpi div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.kpi b{display:block;font-size:20px}.kpi small{color:var(--mut);font-size:11px}

.ppl button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{display:inline-flex;height:8px;width:60px;border-radius:4px;overflow:hidden;flex:none}.bar i{display:block;height:100%}

.tag.u{border-color:var(--B);color:var(--B)}.tag.a{border-color:var(--accent);color:var(--accent)}
select{font:inherit;font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
ol.log{margin:0;padding-left:18px;max-height:300px;overflow:auto;font-size:13px}ol.log li{margin:2px 0}

</head><body><div class="wrap">

<h1>文明シミュ（試作）</h1>
<p class="mut">24人から始まり、生まれ・年をとり・組み・村や町になります。キャラは「自動」「ユーザー」「AI」のどれかが動かします。声をかけると、聞くかどうかは本人しだい。</p>
<div class="box"><div class="kpi"><div><b id="k-year"></b><small>年目</small></div><div><b id="k-pop"></b><small>人口</small></div><div><b id="k-grp"></b><small>集まり</small></div><div><b id="k-tech"></b><small>技術</small></div></div>
<p id="k-stage" class="mut"></p>
<div class="row"><button class="btn" id="y1">1年すすめる</button><button class="btn sub" id="y10">10年</button><button class="btn sub" id="reset">はじめから</button></div></div>
<div class="box"><h2>集まり</h2><div class="grp" id="groups"></div></div>
<div class="box"><h2>キャラ</h2><p class="mut">押すと選べます。色の帯は R・G・B（W は隠れ）。</p><div class="ppl" id="ppl"></div>
<div id="panel" class="box" hidden></div></div>
<div class="box"><h2>年表</h2><p class="mut">節目だけを残します。</p><ol class="log" id="chron"></ol></div>
<div class="box"><h2>マルチの準備</h2><p class="mut">世界は「種」と「行動の記録」だけで決まります。同じ記録を読めば、誰の端末でも同じ世界になります（オンラインはまだ。保存先は後で Firestore に差し替え）。</p><div class="row"><button class="btn sub" id="exp">記録をコピー</button><button class="btn sub" id="chk">検算する</button></div><p class="mut" id="mmsg"></p></div>
<div class="box"><h2>できごと</h2><ol class="log" id="log" reversed></ol></div>
</div>
<script>
(function(){
'use strict';
var KEY='tri-civ-v2',$=function(i){return document.getElementById(i)};
var FERT=window.TRI_FERT||{F:[],M:[]};
var FOCUS={farm:'畑をたがやす',explore:'遠くを見に行く',talk:'人と話す',learn:'学ぶ'};
var FS={farm:'R',explore:'G',talk:'G',learn:'B'};
var RULE={elder:'長子',merit:'実力',vote:'投票'};
var SY=['ア','イ','カ','キ','サ','シ','タ','ト','ナ','ハ','ヒ','マ','ミ','ユ','ラ','リ','ル','レ','ヨ','ワ','セ','ソ','ノ','コ'];
/* マルチの準備：世界＝種＋行動の記録（acts）で決まる。乱数の状態も S に入れ、同じ記録なら誰の端末でも同じ結果になる */
function r(){var s=S.rs=(S.rs+0x6D2B79F5)|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
var S,ME=(function(){try{var v=localStorage.getItem('tri-player');if(!v){v='p'+Math.random().toString(36).slice(2,8);localStorage.setItem('tri-player',v)}return v}catch(e){return 'p0'}})();
var TRAIT=['素直','頑固','せっかち','おだやか','好奇心が強い','人なつこい','用心深い','負けず嫌い'];
function nm(){return SY[Math.floor(r()*SY.length)]+SY[Math.floor(r()*SY.length)]+(r()<.5?SY[Math.floor(r()*SY.length)]:'')}
function birthAP(){var a={R:6,G:6,B:6,W:6};for(var i=0;i<21;i++)a['RGBW'[Math.floor(r()*4)]]++;return a}
function person(sex,ageY,g,parent){var p={id:S.next++,name:nm(),sex:sex,age:ageY*12,ap:birthAP(),peak:.6+r()*.4,shift:Math.floor(r()*5)-2,g:g,partner:null,alive:true,ctrl:'auto',focus:null,heard:0,kids:0,born:S.month,parent:parent||null,trait:TRAIT[Math.floor(r()*TRAIT.length)],owner:null};
 p.focus=bestFocus(p);S.ppl.push(p);return p}
function fert(p){if(p.peak<=0)return 0;var a=Math.max(0,Math.min(100,Math.floor(p.age/12)-p.shift));return ((p.sex==='F'?FERT.F[a]:FERT.M[a])||0)/100}
function stat(p,k){return Math.max(1,p.ap[k]*fert(p))}
function bestFocus(p){var a=p.ap;return a.R>=a.G&&a.R>=a.B?'farm':a.G>=a.B?(r()<.5?'explore':'talk'):'learn'}
function group(id){return S.grp.filter(function(g){return g.id===id})[0]}
function living(g){return S.ppl.filter(function(p){return p.alive&&(g==null||p.g===g)})}
function log(t){S.log.push((Math.floor(S.month/12)+1)+'年目：'+t);if(S.log.length>120)S.log.shift()}
function chron(t){S.chron.push((Math.floor(S.month/12)+1)+'年目　'+t);log(t)}
function stage(n){return n<20?'群れ':n<80?'村':n<300?'町':'国'}
function newGroup(name){var g={id:S.gnext++,name:name,food:40,land:1,tech:0,rule:['elder','merit','vote'][Math.floor(r()*3)],leader:null,rel:{},st:'群れ'};S.grp.push(g);return g}
function init(seed,nosave){S={seed:seed,rs:seed,month:0,next:1,gnext:1,ppl:[],grp:[],log:[],chron:[],acts:[],sel:null,peak:24};
 var g=newGroup('川辺の群れ');for(var i=0;i<24;i++)person(i%2?'F':'M',Math.floor(r()*35)+1,g.id);g.st=stage(24);
 chron('24人が川辺に集まった。決まりは「'+RULE[g.rule]+'」。');if(!nosave)save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v&&v.ppl&&v.rs!=null&&v.acts){S=v;return true}}catch(e){}return false}
/* AIの判断（きまり）：集まりの困りごとに合わせて動く */
function aiFocus(p){var g=group(p.g),n=living(p.g).length;if(g.food<n*2)return 'farm';var low=Object.keys(g.rel).some(function(k){return g.rel[k]<-.3});if(low)return 'talk';return g.tech<n*.5?'learn':'explore'}
function pickLeader(g){var L=living(g.id).filter(function(p){return p.age>=18*12});if(!L.length){g.leader=null;return}
 var c;if(g.rule==='elder')c=L.sort(function(a,b){return b.age-a.age})[0];
 else if(g.rule==='merit')c=L.sort(function(a,b){return (stat(b,'R')+stat(b,'G')+stat(b,'B'))-(stat(a,'R')+stat(a,'G')+stat(a,'B'))})[0];
 else{var v={};L.forEach(function(p){var k=L[Math.floor(r()*L.length)];var best=k;for(var i=0;i<2;i++){var o=L[Math.floor(r()*L.length)];if(stat(o,'G')>stat(best,'G'))best=o}v[best.id]=(v[best.id]||0)+1});var id=Object.keys(v).sort(function(a,b){return v[b]-v[a]})[0];c=L.filter(function(p){return p.id==id})[0]}
 g.leader=c.id;log(g.name+'の長に'+c.name+'がなった（'+RULE[g.rule]+'）。')}
function month(){S.month++;
 if(S.month%120===0)S.ppl=S.ppl.filter(function(p){return p.alive});
 var pop=S.ppl.filter(function(p){return p.alive}).length;[50,100,200,500,1000].forEach(function(n){if(pop>=n&&S.peak<n){S.peak=n;chron('人口が'+n+'人をこえた。')}});
 S.grp.forEach(function(g){var P=living(g.id);if(!P.length)return;var prod=0,tl=0;
  P.forEach(function(p){
   if(p.ctrl==='ai')p.focus=aiFocus(p);else if(p.ctrl==='auto'&&r()<.05)p.focus=r()<.5?aiFocus(p):bestFocus(p);
   if(p.age>=36){var k=r()<.6?FS[p.focus]:'RGBW'[Math.floor(r()*4)];p.ap[k]+=5}else p.ap['RGBW'[Math.floor(r()*4)]]+=5;
   if(p.age>=12*12){if(p.focus==='farm')prod+=stat(p,'R')/18*g.land;else if(p.focus==='explore'){prod+=stat(p,'G')/40;if(r()<.0015)die(p,'遠出の先で戻らなかった')}else if(p.focus==='learn')tl+=stat(p,"B")/300000;else{prod+=.3;Object.keys(g.rel).forEach(function(k){g.rel[k]=Math.min(1,g.rel[k]+stat(p,'G')/4000)})}}
  });
  g.tech+=tl;g.food+=prod*(1+g.tech*.05)-P.length;g.land=Math.max(.4,Math.min(1.3,g.land-.0006*P.filter(function(p){return p.focus==='farm'}).length+.004+g.tech*.0003));
  if(g.food<0){var v=P[Math.floor(r()*P.length)];if(r()<.25)die(v,'食べ物が足りず、弱って亡くなった');g.food=0}
  g.food=Math.min(g.food,P.length*24);
 });
 S.ppl.forEach(function(p){if(!p.alive)return;p.age++;var y=p.age/12;
  if(r()<.00002*Math.exp(.085*y)/1+(y<1?.003:0))die(p,y<1?'赤ちゃんのうちに亡くなった':'年をとって亡くなった');
  if(!p.alive)return;
  if(y>=16&&p.partner==null&&r()<.02){var c=living(p.g).filter(function(q){return q.sex!==p.sex&&q.partner==null&&q.age>=16*12&&Math.abs(q.age-p.age)<15*12})[0];if(c){p.partner=c.id;c.partner=p.id;log(p.name+'と'+c.name+'がいっしょに暮らしはじめた。')}}
  if(p.sex==='F'&&p.partner!=null){var m=S.ppl.filter(function(q){return q.id===p.partner})[0];if(m&&m.alive&&r()<.022*fert(p)*Math.max(.2,fert(m))){var g=group(p.g);var k=person(r()<.5?'F':'M',0,p.g,p.id);p.kids++;if(r()<.08)log(p.name+'と'+m.name+'に'+k.name+'が生まれた。')}}
 });
 S.grp.slice().forEach(function(g){var P=living(g.id);if(!P.length)return;var st=stage(P.length);if(st!==g.st){g.st=st;chron(g.name+'が「'+st+'」になった（'+P.length+'人）。')}
  if(g.leader==null||!S.ppl.some(function(p){return p.id===g.leader&&p.alive&&p.g===g.id}))pickLeader(g);
  if(P.length>=60&&r()<.02){var n=newGroup(['北','南','東','西','丘','森','浜'][Math.floor(r()*7)]+'の'+(r()<.5?'村':'集まり'));g.rel[n.id]=.2;n.rel[g.id]=.2;S.grp.forEach(function(o){if(o!==g&&o!==n){n.rel[o.id]=0;o.rel[n.id]=0}});
   P.filter(function(p,i){return i%2}).forEach(function(p){p.g=n.id;p.partner=null});var half=Math.floor(g.food/2);g.food-=half;n.food=half;n.tech=g.tech*.8;chron(g.name+'から人が分かれ、'+n.name+'ができた。決まりは「'+RULE[n.rule]+'」。')}
 });
 /* 外交と争い：長の性格・関係・実績で自動。全滅しなくても士気で終わる */
 if(S.month%6===0)S.grp.forEach(function(g){Object.keys(g.rel).forEach(function(k){var o=group(+k);if(!o||!living(o.id).length||!living(g.id).length)return;
  var gl=S.ppl.filter(function(p){return p.id===g.leader})[0];var calm=gl?stat(gl,'G')/(stat(gl,'R')+stat(gl,'G')):.5;
  var hungry=g.food<living(g.id).length*2;if(hungry&&g.rel[k]<0&&r()>calm){var a=living(g.id),b=living(o.id),ma=1,mb=1,round=0;while(ma>.4&&mb>.4&&round<6){round++;ma-=r()*.3*(b.length/(a.length+b.length))*2;mb-=r()*.3*(a.length/(a.length+b.length))*2}
   var lose=ma<mb?a:b;if(r()<.6)die(lose[Math.floor(r()*lose.length)],'争いで亡くなった');var win=ma<mb?o:g,ls=ma<mb?g:o;var t=Math.floor(ls.food*.3);ls.food-=t;win.food+=t;g.rel[k]-=.3;o.rel[g.id]=g.rel[k];log(g.name+'と'+o.name+'が争った。士気がくずれた'+ls.name+'が引いた。')}
  else if(!hungry&&r()<calm*.3){g.rel[k]=Math.min(1,g.rel[k]+.1);o.rel[g.id]=g.rel[k];if(g.rel[k]>.6&&r()<.1)log(g.name+'と'+o.name+'が物を分け合った。')}
  else g.rel[k]-=.02*r()})})}
function die(p,why){if(!p.alive)return;p.alive=false;var q=S.ppl.filter(function(x){return x.id===p.partner})[0];if(q)q.partner=null;if(p.ctrl!=='auto'||r()<.15||p.age>=50*12)log(p.name+'（'+Math.floor(p.age/12)+'歳）が'+why+'。')}
function year(n){for(var i=0;i<n*12;i++)month();save();draw()}
/* 行動：ユーザーやAIがキャラに何かするときは必ずここを通す（あとでオンラインの記録に差し替える入口） */
function apply(a){var p=S.ppl.filter(function(x){return x.id===a.pid&&x.alive})[0];if(!p)return '';
 if(a.t!=='voice'&&p.owner&&p.owner!==a.by)return 'ほかのプレイヤーが動かしているキャラです。';
 if(a.t==='ctrl'){p.ctrl=a.v;p.owner=a.v==='user'?a.by:null;if(a.v==='ai')p.focus=aiFocus(p);return ''}
 if(a.t==='focus'){if(p.ctrl==='user')p.focus=a.v;return ''}
 if(a.t==='voice'){var k={'素直':.2,'頑固':-.2,'人なつこい':.1,'用心深い':-.05}[p.trait]||0;var ok=r()<.35+k+p.heard*.1+stat(p,'B')/200;p.heard=Math.min(4,p.heard+1);
  if(p.ctrl==='user'&&p.owner===a.by){p.focus=a.v;return 'あなたが動かしているので、そのとおりにした。'}
  if(ok){p.focus=a.v;return p.name+'は声を聞いて、'+FOCUS[a.v]+'ことにした。'}return p.name+'（'+p.trait+'）は少し考えたが、自分の判断で動くことにした。'}return ''}
function act(a){a.m=S.month;a.by=ME;var msg=apply(a);if(msg.indexOf('ほかのプレイヤー')<0)S.acts.push(a);save();return msg}
function replay(seed,acts,months){var keep=S;init(seed,true);var i=0;function due(){while(i<acts.length&&acts[i].m===S.month){apply(acts[i]);i++}}
 while(S.month<months){due();month()}due();var out=S;S=keep;return out}
function sig(X){return X.ppl.filter(function(p){return p.alive}).map(function(p){return p.id+':'+p.age+':'+p.g+':'+p.focus}).join(',')+'|'+X.grp.map(function(g){return g.id+':'+Math.round(g.food)}).join(',')}
function verify(){var X=replay(S.seed,S.acts,S.month);return sig(X)===sig(S)}
function bar(p){var t=p.ap.R+p.ap.G+p.ap.B;return '<span class="bar"><i style="width:'+(p.ap.R/t*100)+'%;background:var(--R)"></i><i style="width:'+(p.ap.G/t*100)+'%;background:var(--G)"></i><i style="width:'+(p.ap.B/t*100)+'%;background:var(--B)"></i></span>'}
function draw(){var A=living();$('k-year').textContent=Math.floor(S.month/12)+1;$('k-pop').textContent=A.length;var G=S.grp.filter(function(g){return living(g.id).length});$('k-grp').textContent=G.length;
 var tech=G.reduce(function(s,g){return Math.max(s,g.tech)},0);$('k-tech').textContent=tech.toFixed(1);
 var big=G.sort(function(a,b){return living(b.id).length-living(a.id).length})[0];var bn=big?living(big.id).length:0,nx=bn<20?20:bn<80?80:bn<300?300:0,nn={20:'村',80:'町',300:'国'}[nx];$('k-stage').textContent=big?'いちばん大きい集まり：'+big.name+'（'+stage(bn)+'）'+(nx?'　次の節目：'+nn+'まで あと'+(nx-bn)+'人':''):'人がいなくなった。';
 $('chron').innerHTML=S.chron.slice(-12).reverse().map(function(t){return '<li>'+t+'</li>'}).join('');
 $('groups').innerHTML=G.map(function(g){var P=living(g.id),L=S.ppl.filter(function(p){return p.id===g.leader})[0];return '<div><span><b>'+g.name+'</b>　'+stage(P.length)+'・'+P.length+'人</span><span class="mut">長 '+(L?L.name:'なし')+'（'+RULE[g.rule]+'）　食 '+Math.max(0,Math.round(g.food))+'</span></div>'}).join('');
 var L=A.filter(function(p){return p.ctrl!=='auto'}).concat(A.filter(function(p){return p.ctrl==='auto'&&p.age>=12*12}).sort(function(a,b){return b.age-a.age})).slice(0,40);
 $('ppl').innerHTML=L.map(function(p){return '<button data-id="'+p.id+'"'+(S.sel===p.id?' class="on"':'')+'>'+bar(p)+'<b>'+p.name+'</b><span class="mut">'+(p.sex==='F'?'女':'男')+' '+Math.floor(p.age/12)+'歳・'+group(p.g).name+'</span>'+'<span class="tag">'+p.trait+'</span>'+(p.ctrl==='user'?'<span class="tag u">'+(p.owner===ME?'あなた':'ほかの人')+'</span>':p.ctrl==='ai'?'<span class="tag a">AI</span>':'')+'</button>'}).join('');
 document.querySelectorAll('#ppl button').forEach(function(b){b.onclick=function(){S.sel=+b.dataset.id;draw()}});
 panel();$('log').innerHTML=S.log.slice().reverse().slice(0,60).map(function(t){return '<li>'+t+'</li>'}).join('')}
function panel(){var p=S.ppl.filter(function(x){return x.id===S.sel&&x.alive})[0],el=$('panel');if(!p){el.hidden=true;return}el.hidden=false;
 var sel=function(id,obj,v){return '<select id="'+id+'">'+Object.keys(obj).map(function(k){return '<option value="'+k+'"'+(k===v?' selected':'')+'>'+obj[k]+'</option>'}).join('')+'</select>'};
 el.innerHTML='<h2>'+p.name+'（'+(p.sex==='F'?'女':'男')+' '+Math.floor(p.age/12)+'歳）</h2><p class="mut">性格：'+p.trait+'。いま：'+FOCUS[p.focus]+'。子ども '+p.kids+'人。</p>'+
 '<div class="row">動かす人 '+sel('c-ctrl',{auto:'自動（本人）',user:'ユーザー',ai:'AI'},p.ctrl)+'</div>'+
 (p.ctrl==='user'?'<div class="row">すること '+sel('c-focus',FOCUS,p.focus)+'</div>':'')+
 '<div class="row">'+sel('c-voice',FOCUS,p.focus)+'<button class="btn sub" id="c-say">と声をかける</button></div><p class="mut" id="c-msg"></p>';
 $('c-ctrl').onchange=function(){var m=act({t:'ctrl',pid:p.id,v:this.value});draw();if(m)$('c-msg').textContent=m};
