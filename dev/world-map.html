<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>世界地図 | TRIATHLON</title>
<style>
:root{--bg:#edf3f1;--card:#fff;--fg:#183941;--mut:#60767b;--line:#cadbdd;--sea:#79b7c8;--coast:#d9d59a;--land:#92b67a;--hill:#78946c;--desert:#d6bd78;--ice:#e6f2f5;--mark:#d95655}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 16px 64px;display:grid;gap:14px}a{color:#176778}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0}.mut{margin:0;color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.viewport{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--sea);touch-action:none}.map{display:grid;grid-template-columns:repeat(17,28px);grid-template-rows:repeat(11,28px);width:max-content}.cell{width:28px;height:28px;border:0;padding:0;position:relative;background:var(--sea);cursor:pointer}.cell.sea{background:var(--sea)}.cell.coast{background:var(--coast)}.cell.land{background:var(--land)}.cell.hill{background:var(--hill)}.cell.desert{background:var(--desert)}.cell.ice{background:var(--ice)}.cell.here:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--mark);border:2px solid #fff;box-shadow:0 1px 3px #345}.controls{display:grid;grid-template-columns:44px 44px 44px;gap:5px;justify-content:center;margin:12px 0}.controls button{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);font-size:17px;cursor:pointer}.controls button:nth-child(1){grid-column:2}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-1px}.hint{border-left:3px solid #258491;padding-left:10px}
</style><script src="return.js?v=20261101" defer></script><script src="world-map.js?v=20261108"></script></head><body><main class="wrap">
<nav><a href="./">← 開発トップ</a></nav>
<header><h1>世界地図</h1><p class="mut">地球のように、東西へ進み続けると反対側から戻る世界の土台。</p></header>
<section class="card"><div class="viewport"><div id="map" class="map" aria-label="世界地図"></div></div><div class="controls"><button id="north" aria-label="北へ">↑</button><button id="west" aria-label="西へ">←</button><button id="south" aria-label="南へ">↓</button><button id="east" aria-label="東へ">→</button></div><p class="mut hint" id="status"></p></section>
<section class="card"><h2>最初の決まり</h2><p>世界は48×24の地域ブロックでできています。東西だけは循環し、端を越えると反対側へ続きます。南北は極で止まります。いまは地形だけで、住人・建物・交通はまだ置きません。</p><div class="legend"><span><i style="background:var(--sea)"></i>海</span><span><i style="background:var(--land)"></i>平原</span><span><i style="background:var(--hill)"></i>山地</span><span><i style="background:var(--desert)"></i>乾いた土地</span><span><i style="background:var(--ice)"></i>氷原</span></div></section>
</main><script>
(function(){var M=window.TRI_WORLD_MAP,$=function(x){return document.getElementById(x)},p={x:24,y:12},view={w:17,h:11};
function draw(){var s='';for(var dy=-5;dy<=5;dy++){for(var dx=-8;dx<=8;dx++){var x=M.wrap(p.x+dx),y=Math.max(0,Math.min(M.H-1,p.y+dy)),t=M.land(x,y),here=x===p.x&&y===p.y;s+='<button class="cell '+t+(here?' here':'')+'" data-x="'+x+'" data-y="'+y+'" aria-label="'+M.area(x,y)+'"></button>'}}$('map').innerHTML=s;$('status').textContent='現在地：'+M.area(p.x,p.y)+'（地域 '+p.x+' , '+p.y+'）　東西はどこまでもつながる。';
document.querySelectorAll('.cell').forEach(function(b){b.onclick=function(){p={x:+b.dataset.x,y:+b.dataset.y};draw()}})}
function go(x,y){p=M.move(p,x,y);draw()}$('north').onclick=function(){go(0,-1)};$('south').onclick=function(){go(0,1)};$('west').onclick=function(){go(-1,0)};$('east').onclick=function(){go(1,0)};
window.addEventListener('keydown',function(e){var k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(k){e.preventDefault();go(k[0],k[1])}});draw()})();
</script></body></html>
