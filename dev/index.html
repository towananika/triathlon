<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>開発 | TRIATHLON</title><style>body{margin:0;background:#f5f9f8;color:#163744;font:16px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:860px;margin:0 auto;padding:28px 16px 48px}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:26px 0 10px}.sub{color:#58717a;margin:0 0 16px}.gate-msg{background:#fff;border:1px solid #cbdedf;border-radius:14px;padding:18px}.gate-btn{display:inline-block;margin-top:12px;background:#007f87;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 22px}.box{background:#fff;border:1px solid #cbdedf;border-radius:14px;padding:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e3eeee;overflow-wrap:anywhere}th{color:#58717a;font-weight:600}textarea{box-sizing:border-box;width:100%;min-height:160px;border:1px solid #cbdedf;border-radius:10px;padding:10px;font:15px/1.7 system-ui,sans-serif;color:#163744}button{font:700 14px system-ui,sans-serif;border-radius:999px;border:1px solid #007f87;background:#007f87;color:#fff;padding:8px 18px;cursor:pointer}button.ghost{background:#fff;color:#007f87}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.note{font-size:13px;color:#58717a}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.links a{display:block;background:#fff;border:1px solid #cbdedf;border-radius:12px;padding:12px 14px;color:#163744;text-decoration:none;font-weight:700}.links a small{display:block;font-weight:400;color:#58717a}.tasks{list-style:none;margin:0;padding:0}.tasks li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e3eeee}.tasks li span{flex:1;overflow-wrap:anywhere}.tasks li.done span{text-decoration:line-through;color:#8a979c}.tasks input[type=checkbox]{width:20px;height:20px}.x{background:none;border:0;color:#8a979c;padding:4px 8px;font-size:18px}input.add{flex:1;min-width:0;min-height:42px;border:1px solid #cbdedf;border-radius:10px;padding:0 12px;font:15px system-ui,sans-serif}</style></head><body data-development-target="/dev/">
<script src="../site-nav.js?v=0.30"></script>
<main><h1>開発</h1><p class="sub">開発中のタスクと、開発用の道具。</p>
<div id="gate"></div>
<div id="admin-body" hidden>
<h2>開発タスク</h2><div class="box"><ul class="tasks" id="tasks"><li>読みこみ中…</li></ul>
<form class="row" id="addf"><input class="add" id="addt" placeholder="やることを足す" maxlength="200"><button type="submit">追加</button></form></div>
<h2>開発用の道具</h2><div class="links">
<a href="../play/?dev">開発版で遊ぶ<small>20秒で1か月・すぐ生まれる</small></a>
<a href="../admin/">管理ページ<small>利用者と管理メモ</small></a>
<a href="https://triathlon-world.remitech-inc-1623.chatgpt.site/dev/" target="_top">ChatGPTの開発サイト<small>くわしい設定資料はこちら</small></a>
</div></div></main>
<script>
window.triAdminReady = function (f, u) {
  var col = f.collection(f.db, 'devTasks'), ul = document.getElementById('tasks');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  f.onSnapshot(f.query(col, f.orderBy('at', 'asc')), function (s) {
    var h = []; s.forEach(function (d) { var t = d.data();
      h.push('<li class="' + (t.done ? 'done' : '') + '" data-id="' + d.id + '"><input type="checkbox"' + (t.done ? ' checked' : '') + ' aria-label="できた"><span>' + esc(t.text) + '</span><button class="x" type="button" aria-label="消す">×</button></li>'); });
    ul.innerHTML = h.join('') || '<li><span class="note">まだありません</span></li>';
  }, function (e) { ul.innerHTML = '<li>読めませんでした（' + esc(e.code) + '）</li>'; });
  ul.addEventListener('click', function (e) {
    var li = e.target.closest('li[data-id]'); if (!li) return; var ref = f.doc(f.db, 'devTasks', li.dataset.id);
    if (e.target.type === 'checkbox') f.updateDoc(ref, { done: e.target.checked });
    else if (e.target.classList.contains('x') && confirm('このタスクを消しますか？')) f.deleteDoc(ref);
  });
  document.getElementById('addf').onsubmit = function (e) { e.preventDefault(); var i = document.getElementById('addt'), v = i.value.trim(); if (!v) return;
    f.addDoc(col, { text: v, done: false, by: u.email, at: f.serverTimestamp() }); i.value = ''; };
};
</script>
<script src="../login/gate.js?v=0.28"></script>
</body></html>
