<!doctype html>
<html lang="ja" data-admin-only>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>キャラ編集 | 開発版 | TRIATHLON</title>
<script src="../tri-admin.js?v=0.23"></script>
<link rel="stylesheet" href="dev.css?v=0.19">
</head>
<body>
<script src="../site-nav.js?v=0.23"></script>
<div class="devbar">DEV · キャラ編集</div>
<main>
<h1>✏️ キャラ編集</h1>
<p class="lead">直した内容はこの端末に自動で保存され、あなたのキャラ図鑑にだけ先に表示されます。サイトに出すときは「Claude に渡す」でコピーして、チャットに貼ってください。</p>
<div class="tabs" id="tabs"></div>
<div class="who" id="who"></div>
<section class="form" id="form"></section>
<section class="form"><h2>Claude に渡す</h2><p class="lead" id="sum"></p><pre class="out" id="out"></pre>
<div class="bar"><button class="btn" id="copy" type="button">📋 コピー</button><a class="btn sub" href="../cast/">キャラ図鑑で見る</a><button class="btn warn" id="reset" type="button">すべての変更を消す</button></div><p class="msg" id="msg" role="status"></p></section>
</main>
<script src="../cast/cast-data.js?v=0.19"></script>
<script src="../cast/cast-apply.js?v=0.19"></script>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var ed = castEdits(), tab = 1, cur = CHARS[0].id, BASE = {};
  CHARS.forEach(function (c) { BASE[c.id] = {}; CAST_FIELDS.forEach(function (f) { BASE[c.id][f[0]] = String(castGet(c, f[0], f[2])); }); });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function val(id, k) { return ed[id] && k in ed[id] ? ed[id][k] : BASE[id][k]; }
  function save() { try { localStorage.setItem(CAST_EDIT_KEY, JSON.stringify(ed)); } catch (e) {} }
  function nm(c) { return val(c.id, 'name') || '？'; }
  function prompt(c) {
    var v = function (k) { return val(c.id, k); }, tr = c.fixed.concat((SEED[c.id] || {}).trait ? [SEED[c.id].trait] : []).join('、');
    return '2Dアニメ調のキャラクター立ち絵。全身・正面・無地の淡い背景。高校生の' + v('sex') + '「' + v('name') + '」、クラスは' + v('cls') + '。身長' + v('h') + 'cm、体型は' + v('b') + '。髪：' + v('hair') + '。目：' + v('eye') + '。肌：' + v('skin') + '。服：' + v('wear') + '。トレードマーク：' + v('mark') + '。' + (tr ? '雰囲気：' + tr + '。' : '') + '第1期の9人と同じ画風・同じ等身で、ほかのキャラと見分けがつく顔立ちに。';
  }
  function out() {
    var n = 0, lines = [];
    Object.keys(ed).forEach(function (id) {
      var c = CHARS.filter(function (x) { return x.id === id; })[0], ks = Object.keys(ed[id]);
      if (!c || !ks.length) return;
      lines.push('■ ' + BASE[id].name + '（' + id + '）');
      ks.forEach(function (k) { var f = CAST_FIELDS.filter(function (x) { return x[0] === k; })[0]; lines.push('・' + f[1] + '：' + BASE[id][k] + ' → ' + ed[id][k]); n++; });
    });
    $('sum').textContent = n ? n + 'か所を直しています。' : 'まだ変更はありません。';
    $('out').textContent = n ? 'キャラ編集をサイトに反映して\n' + lines.join('\n') + '\n\n' + JSON.stringify({ cast_edits: ed }) : '';
    $('copy').disabled = !n;
  }
  function render() {
    $('tabs').innerHTML = [1, 2, 3, 4].map(function (s) { return '<button type="button" data-t="' + s + '" aria-pressed="' + (s === tab) + '">第' + s + '期</button>'; }).join('');
    $('who').innerHTML = CHARS.filter(function (c) { return c.s === tab; }).map(function (c) {
      var n = ed[c.id] ? Object.keys(ed[c.id]).length : 0;
      return '<button type="button" data-id="' + c.id + '" aria-pressed="' + (c.id === cur) + '" style="--c:var(--' + c.c + ')">' + esc(nm(c)) + (n ? ' <i>●' + n + '</i>' : '') + '</button>';
    }).join('');
    var c = CHARS.filter(function (x) { return x.id === cur; })[0];
    $('form').innerHTML = '<h2>' + esc(nm(c)) + '<small style="font-size:13px;color:var(--muted);font-weight:600"> 第' + c.s + '期・' + esc(val(c.id, 'cls')) + '</small></h2><div class="fields">' + CAST_FIELDS.map(function (f) {
      var v = val(c.id, f[0]), ch = ed[c.id] && f[0] in ed[c.id], long = /^(rel|wish|weak|like|dislike|wear)$/.test(f[0]);
      return '<label class="' + (ch ? 'ch' : '') + '"><span>' + f[1] + '</span>' + (long ? '<textarea data-k="' + f[0] + '">' + esc(v) + '</textarea>' : '<input data-k="' + f[0] + '" value="' + esc(v) + '"' + (f[0] === 'h' ? ' inputmode="numeric"' : '') + '>') + '</label>';
    }).join('') + '</div><div class="bar"><button class="btn sub" type="button" data-pr="1">🎨 絵の指示文をコピー</button><button class="btn warn" type="button" data-undo="1">この人の変更を消す</button></div>';
    out();
  }
  function copy(t, b) {
    var o = b.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = '✅ コピーしました'; setTimeout(function () { b.textContent = o; }, 1500); }, function () { $('msg').textContent = 'コピーできませんでした。上の文を長押しで選んでください'; });
  }
  document.addEventListener('input', function (e) {
    var k = e.target.dataset.k; if (!k) return;
    var v = e.target.value;
    ed[cur] = ed[cur] || {};
    if (v === BASE[cur][k]) delete ed[cur][k]; else ed[cur][k] = v;
    if (!Object.keys(ed[cur]).length) delete ed[cur];
    save();
    e.target.parentNode.className = ed[cur] && k in ed[cur] ? 'ch' : '';
    var n = ed[cur] ? Object.keys(ed[cur]).length : 0, b = document.querySelector('#who [data-id="' + cur + '"]');
    if (b) b.innerHTML = esc(nm(CHARS.filter(function (x) { return x.id === cur; })[0])) + (n ? ' <i>●' + n + '</i>' : '');
    out();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) { tab = +b.dataset.t; cur = CHARS.filter(function (c) { return c.s === tab; })[0].id; render(); }
    else if (b.dataset.id) { cur = b.dataset.id; render(); }
    else if (b.dataset.pr) copy(prompt(CHARS.filter(function (x) { return x.id === cur; })[0]), b);
    else if (b.dataset.undo) { delete ed[cur]; save(); render(); }
  });
  $('copy').onclick = function () { copy($('out').textContent, this); };
  $('reset').onclick = function () { if (confirm('すべての変更を消しますか？')) { ed = {}; save(); render(); } };
  render();
})();
</script>
</body>
</html>
