<a class="back" href="./">← 開発トップ</a><h1>龍山・100m地図</h1><p class="sub">龍山駅の周辺に、100mごとの10ブロックを置く最小試作。</p>
<section class="card"><div id="map" aria-label="龍山駅周辺の地図"></div><p class="note"><span class="key">現在地</span> 龍山駅　／　格子1枚＝およそ100m × 100m。人工物は表示せず、現実の座標を土台にした戦後30年の状態だけを表示します。</p></section>
<p class="note">地図データ © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>。現実の座標・地形を土台にしていますが、色は「戦後30年」という架空シナリオの結果であり、現実の被害を示すものではありません。</p>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(function(){var c=[37.52995,126.96483],m=L.map('map',{zoomControl:true}).setView(c,17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(m);L.circleMarker(c,{radius:8,color:'#fff',weight:3,fillColor:'#d95655',fillOpacity:1}).addTo(m).bindPopup('<b>龍山駅</b><br>最初の地域中心').openPopup();
var lat=100/111320,lng=100/(111320*Math.cos(c[0]*Math.PI/180)),startLat=c[0]-lat,startLng=c[1]-lng*2.5;
/* 現実の龍山駅周辺は高密度な市街地として開始し、ここでは戦後30年の架空シナリオを適用する。現在の建物を表示・保存しない。 */
var RESULT=[['自然回復','#779b72'],['廃墟','#8d7d68'],['廃墟','#8d7d68'],['自然回復','#779b72'],['自然回復','#779b72'],['自然回復','#779b72'],['廃墟','#8d7d68'],['立入困難','#71566d'],['廃墟','#8d7d68'],['自然回復','#779b72']];
function state(x,y){return RESULT[y*5+x]}
for(var y=0;y<2;y++)for(var x=0;x<5;x++){var sw=[startLat+y*lat,startLng+x*lng],ne=[startLat+(y+1)*lat,startLng+(x+1)*lng],z=state(x,y);var r=L.rectangle([sw,ne],{color:'#f7f3e8',weight:1,opacity:.8,fillColor:z[1],fillOpacity:.94}).addTo(m);r.bindTooltip('ブロック '+(y*5+x+1)+'：'+z[0],{sticky:true});if(x===2&&y===1)r.setStyle({color:'#d95655',weight:2,opacity:1})}
L.control.scale({imperial:false}).addTo(m);})();
</script></body></html>
