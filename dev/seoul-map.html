<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>1,000ランド | TRIATHLON</title>
<style>:root{--bg:#eef3f1;--fg:#173841;--mut:#60767b;--line:#c8dadd;--acc:#087f88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,"Noto Sans JP",sans-serif}.wrap{max-width:860px;margin:auto;padding:20px 16px 60px}.back{color:#176778;font-size:13px}h1{font-size:24px;margin:16px 0 3px}.sub,.note{color:var(--mut);font-size:13px;margin:0 0 12px}.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:9px;background:#b5dbe1;cursor:crosshair}.info{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}.tag{border-radius:999px;background:#e6f3f1;color:#17636a;padding:3px 9px;font-size:12px;font-weight:700}</style><script src="return.js?v=20261101" defer></script></head><body><main class="wrap">
<a class="back" href="./">← 開発トップ</a><h1>1,000ランド</h1><p class="sub">1ランド＝1m × 1m。40 × 25の、地理情報が「高さ」だけの最小マップ。</p>
<section class="card"><canvas id="map" width="800" height="500" aria-label="1000ランドの高さ地図"></canvas><div class="info"><span class="tag">1,000 ランド</span><span class="tag">40m × 25m</span><span class="tag" id="read">ランドを選ぶ</span></div></section>
<p class="note">色は高さだけを示します。低地は青、高地は緑から茶。水・森・建物・人はまだ存在しません。</p>
</main><script>
(function(){var W=40,H=25,C=document.getElementById('map'),X=C.getContext('2d'),R=document.getElementById('read'),A=[];
function noise(x,y){var a=Math.sin(x*.31+y*.23)*.35,b=Math.sin(x*.08-y*.12)*.3,c=Math.cos(x*.51+y*.37)*.12;return Math.max(0,Math.min(1,.48+a+b+c))}
function color(h){if(h<.28)return 'rgb(100,170,198)';if(h<.43)return 'rgb(151,195,165)';if(h<.62)return 'rgb(102,157,112)';if(h<.79)return 'rgb(151,132,91)';return 'rgb(220,224,218)'}
for(var y=0;y<H;y++)for(var x=0;x<W;x++)A.push(Math.round(noise(x,y)*100));
function draw(hit){var cw=C.width/W,ch=C.height/H;for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=y*W+x;X.fillStyle=color(A[i]/100);X.fillRect(x*cw,y*ch,cw,ch);if(hit===i){X.strokeStyle='#d95655';X.lineWidth=3;X.strokeRect(x*cw+1.5,y*ch+1.5,cw-3,ch-3)}}}
C.onclick=function(e){var b=C.getBoundingClientRect(),x=Math.floor((e.clientX-b.left)*W/b.width),y=Math.floor((e.clientY-b.top)*H/b.height),i=y*W+x;draw(i);R.textContent='ランド '+(i+1)+'（'+x+'m, '+y+'m） 高さ '+A[i]};draw()})();
</script></body></html>
