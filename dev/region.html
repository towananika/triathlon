<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>小地域の年代記 | TRIATHLON</title>
<style>
:root{--bg:#f1eee4;--card:#fffdf7;--fg:#303b35;--mut:#68736c;--line:#d9d6c8;--acc:#52735e;--soft:#e7f0e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui,"Noto Sans JP",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 64px;display:grid;gap:14px}a{color:#396554}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0}.sub,.mut{font-size:13px;color:var(--mut);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{border:1px solid var(--line);background:#f7f5ec;border-radius:12px;padding:10px 5px;min-height:92px;text-align:center;color:var(--fg);cursor:pointer;font:inherit}.tile small{display:block;color:var(--mut);font-size:11px;line-height:1.35}.tile.on{outline:3px solid var(--acc);background:var(--soft)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats div{border-radius:10px;background:#f4f2e9;padding:8px;text-align:center}.stats b{font-size:19px;display:block}.stats small{font-size:11px;color:var(--mut)}button{font:700 14px system-ui;border:0;border-radius:999px;padding:9px 16px;background:var(--acc);color:white;cursor:pointer}button.sub{background:var(--card);border:1px solid var(--line);color:var(--fg)}.row{display:flex;gap:8px;flex-wrap:wrap}.log{margin:0;padding-left:20px;display:grid;gap:5px;max-height:340px;overflow:auto;font-size:14px}.tag{font-size:12px;background:var(--soft);color:#315640;padding:3px 8px;border-radius:999px;display:inline-block}@media(max-width:500px){.map{grid-template-columns:repeat(3,1fr)}}
</style><script src="return.js?v=20261101" defer></script><script src="region-sim.js?v=20261108"></script></head><body><main class="wrap">
<nav><a href="./">← 開発トップ</a></nav>
<header><h1>小地域の年代記</h1><p class="sub">地形・資源・偶然から、一つの地域の歴史が生まれる最小試作。</p></header>
<section class="card"><h2>地域</h2><p class="mut">拠点を選ぶと、その場所に関わる出来事が起きやすくなります。まずは一地域だけを扱います。</p><div class="map" id="map"></div></section>
<section class="card"><div class="stats" id="stats"></div><p class="mut" id="place"></p><div class="row"><button id="next">1年すすめる</button><button class="sub" id="five">5年すすめる</button><button class="sub" id="reset">最初から</button></div></section>
<section class="card"><h2>年代記</h2><p class="mut">数字ではなく、住人が覚えている節目を残します。</p><ol class="log" id="chron"></ol></section>
<section class="card"><span class="tag">試作の見る点</span><p>森、川、畑、廃墟、丘のどれが、暮らし・交易・知識・安全にどうつながるかを確認するためのものです。戦闘や国家は、ここで自然な因果が見えてから足します。</p></section>
</main><script>
(function(){var C=window.TRI_REGION,$=function(x){return document.getElementById(x)};C.init(20261108);
function draw(){var s=C.S;$('map').innerHTML=C.tiles.map(function(t){return '<button class="tile '+(t.id===s.home?'on':'')+'" data-id="'+t.id+'"><b>'+t.icon+'<br>'+t.name+'</b><small>'+t.note+'</small></button>'}).join('');document.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){C.setHome(b.dataset.id);draw()}});$('stats').innerHTML=[['人',s.pop],['食べ物',s.food],['信頼',s.trust],['知識',s.knowledge],['道・水路',s.infra],['交易',s.trade]].map(function(x){return '<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>'}).join('');var t=C.tiles.filter(function(t){return t.id===s.home})[0];$('place').textContent=s.year+'年目　拠点：'+t.name;$('chron').innerHTML=s.chron.slice().reverse().map(function(x){return '<li>'+x+'</li>'}).join('')}
$('next').onclick=function(){C.advance();draw()};$('five').onclick=function(){for(var i=0;i<5;i++)C.advance();draw()};$('reset').onclick=function(){C.init(Date.now());draw()};draw()})();
</script></body></html>
