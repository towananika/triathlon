<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>html,body{margin:0;padding:0;background:#0b1220}</style></head><body>
<title>漢江ハイウェイ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800&family=Noto+Sans+KR:wght@500;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* layout: full-screen first-person canvas; HUD pinned to corners; menus are one sheet with three tabs */
:root{
  --night:#0b1220; --panel:rgba(10,18,30,.86); --ink:#eef3f8; --sub:#93a6bb; --line:#23344d; --tile:#16233a;
  --sign:#0f6a43; --gold:#ffcf4a; --red:#ef4b4f; --blue:#5aa9ff;
  --f-jp:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-jp);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));display:grid;gap:8px;justify-items:start}
.limit{width:40px;height:40px;border-radius:50%;background:#fff;border:5px solid var(--red);color:#111;display:grid;place-items:center;font:700 18px var(--f-num);box-sizing:border-box}
.rb{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(10,18,30,.7);color:var(--ink);font:800 12px var(--f-jp);display:grid;place-items:center;cursor:pointer}
.rb.on{background:var(--gold);color:#1b1400}
.rb .dot{position:absolute;margin:-26px 0 0 26px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-radius:12px;padding:6px 10px;font:600 15px var(--f-num);display:grid;gap:3px;text-align:right;font-variant-numeric:tabular-nums}
.tr span{color:var(--sub);font:500 10px var(--f-jp)}
.meter{display:grid;grid-template-columns:2.6em 60px;text-align:left;align-items:center;gap:4px;font:500 10px var(--f-jp);color:var(--sub)}
.meter i{display:block;height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.meter em{display:block;height:100%;width:100%;background:#4cd18a;border-radius:4px}
.nav{position:absolute;left:50%;transform:translateX(-50%);top:calc(11vh + env(safe-area-inset-top,0px));background:var(--sign);border:2px solid #e9f5ee;border-radius:10px;padding:5px 12px;display:flex;gap:10px;align-items:center;min-width:180px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.nav.straight{background:#0b4fa0}
.nav.n-hiyoko{background:#f5c400;color:#1b1b1b;border-color:#fff8d6}.nav.n-hiyoko.straight{background:#2b2b2b;color:#fff}
.nav.n-midori{background:#0a9f55;border-color:#d9ffe9}.nav.n-midori.straight{background:#173226}
.nav.n-sky{background:#1747c9;border-color:#ffd2d2}.nav.n-sky.straight{background:#0f1a3a}
.nav.n-world{background:#fff;color:#15325e;border-color:#cfd8e6}.nav.n-world.straight{background:#f3f5f8;color:#222}
.nav .lanes i.hp{background:#2f6fd6}
.nav .cw{font:800 12px var(--f-num);margin-top:3px;background:#ffd84a;color:#111;border-radius:6px;padding:1px 6px;display:inline-block}.nav .cw.over{background:#ef4b4f;color:#fff}
.navs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.navc{appearance:none;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:grid;gap:2px;cursor:pointer;font-family:var(--f-jp);color:#fff}
.navc.sel{outline:3px solid #fff;outline-offset:-1px}.navc .nvi{font-size:18px}.navc b{font:800 13px var(--f-jp)}.navc small{font-size:10px;opacity:.85}
.navc.n-hiyoko{background:#f5c400;color:#1b1b1b}.navc.n-midori{background:#0a9f55}.navc.n-sky{background:#1747c9}.navc.n-world{background:#fff;color:#15325e}
.hereC{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:10px}.hereC .pin{font-size:26px}.hereC b{font:800 15px var(--f-jp);display:block}.hereC small{color:var(--sub);font-size:11px;display:block}
.taxiT{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--tile);color:var(--ink);border-radius:12px;padding:8px 12px;font:700 14px var(--f-jp);cursor:pointer}.taxiT small{grid-column:1/-1;color:var(--sub);font-size:11px}.taxiT b{font:800 13px var(--f-num);color:var(--sub)}.taxiT.on{border-color:#f5c400;background:#2c2608}.taxiT.on b{color:#f5c400}
.taxiM{background:#f5c400;color:#1b1b1b;border-radius:8px;padding:2px 8px;font:800 15px var(--f-num)}
.acct{font:600 11px var(--f-jp);color:var(--sub);text-align:right}
.pv{position:relative}.pv canvas{width:100%;height:auto;border-radius:12px;display:block}.pvb{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}.pvb .cfgc{padding:3px 8px;font-size:11px;background:rgba(10,18,30,.75)}
.optl{display:grid!important;grid-template-columns:1fr 1fr;gap:6px}.optc{appearance:none;border:2px solid var(--line);background:var(--tile);color:var(--ink);border-radius:10px;padding:6px 8px;text-align:left;display:grid;gap:2px;cursor:pointer;font-family:var(--f-jp)}.optc b{font:800 12px var(--f-jp)}.optc small{font-size:10px;color:var(--sub);line-height:1.3}.optc i{font:700 11px var(--f-num);font-style:normal;color:var(--gold)}.optc.sel{border-color:var(--gold)}.optc:disabled{opacity:.75;cursor:default}
.cfgc:disabled{opacity:.4}
.cfgtop{display:flex;justify-content:space-between;align-items:center;font:800 16px var(--f-jp)}.cfgx{appearance:none;border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer}
.cfgh{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:center}.cfgh .sw{height:100%;min-height:36px}.cfgh b{font:800 16px var(--f-jp);display:block}.cfgh small{color:var(--sub);font-size:11px}
.cfgr{display:grid;gap:5px}.cfgr>span{font:700 12px var(--f-jp);color:var(--sub)}.cfgr>div{display:flex;flex-wrap:wrap;gap:6px}
.cfgc{appearance:none;border:2px solid var(--line);background:var(--tile);color:var(--ink);border-radius:10px;padding:6px 10px;font:700 12px var(--f-jp);cursor:pointer}.cfgc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cfgsum{display:flex;gap:10px;align-items:baseline;justify-content:flex-end;font:700 13px var(--f-jp)}.cfgsum s{color:var(--sub)}.cfgsum b{color:var(--gold);font-size:18px}
.specb{appearance:none;border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:14px;padding:4px 10px;font:700 12px var(--f-jp);cursor:pointer}
.shopF{display:flex;gap:6px;margin:6px 0}.shopF button{appearance:none;border:1px solid var(--line);background:var(--tile);color:var(--sub);border-radius:16px;padding:5px 12px;font:700 12px var(--f-jp);cursor:pointer}.shopF button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag.imp{background:#4a3a1d;color:#ffe2a8}.tag.ev{background:#123c5a;color:#9fd4ff}
.paint{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.paint button{width:24px;height:24px;border-radius:50%;border:2px solid #0006;cursor:pointer;padding:0}.paint button.sel{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.nav .ar{font:800 30px/1 var(--f-jp);width:30px;text-align:center}
.nav .nm{font:800 15px/1.2 var(--f-jp)}
.nav .ds{font:700 20px/1 var(--f-num);font-variant-numeric:tabular-nums}
.lanes{display:flex;gap:3px;margin-top:4px}
.lanes i{width:12px;height:14px;border-radius:2px;background:rgba(255,255,255,.25)}
.lanes i.on{background:var(--gold)}
.pop{position:fixed;left:50%;transform:translateX(-50%);top:calc(11vh + 64px + env(safe-area-inset-top,0px));width:min(92vw,420px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-sizing:border-box;display:grid;gap:6px;pointer-events:auto}
.pop h3{margin:0;font:800 13px var(--f-jp);display:flex;justify-content:space-between}
.screen{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(94vw,520px);height:min(40vh,300px);background:linear-gradient(#0d1729,#070c16);border:3px solid #2a2f38;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(90,169,255,.15);display:grid;grid-template-rows:auto 1fr;pointer-events:auto;overflow:hidden;box-sizing:border-box}
.sctabs{display:grid;grid-template-columns:repeat(5,1fr) 36px;border-bottom:1px solid #1d2a3e}
.sctabs button{appearance:none;border:0;background:none;color:var(--sub);font:700 13px var(--f-jp);padding:9px 2px;cursor:pointer}
.sctabs button.sel{color:var(--ink);box-shadow:inset 0 -3px 0 var(--blue)}
.scp{padding:10px;overflow:auto;display:grid;gap:8px;align-content:start;min-height:0}
.scars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.scar{appearance:none;border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:8px;color:var(--ink);text-align:left;display:grid;gap:3px;cursor:pointer;font-family:var(--f-jp)}
.scar.sel{border-color:var(--blue)}
.scar b{font:800 13px var(--f-jp)}.scar small{font-size:10px;color:var(--sub)}
.ebig{display:flex;align-items:baseline;gap:10px}.ebig b{font:700 44px/1 var(--f-num)}.ebig span{color:var(--sub);font-size:12px}
.ebar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.ebar em{display:block;height:100%;background:var(--blue)}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.egrid div{background:var(--tile);border-radius:10px;padding:6px 8px;display:grid}.egrid span{font-size:10px;color:var(--sub)}.egrid b{font:700 20px var(--f-num)}
.tag{font:700 10px var(--f-jp);background:#1d3550;color:#cfe0ff;border-radius:6px;padding:1px 6px;margin-left:6px}
.ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.ctrl .grp{display:flex;gap:10px;pointer-events:auto}
.btn{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);color:var(--ink);font:800 24px var(--f-jp);display:grid;place-items:center;touch-action:none;backdrop-filter:blur(2px)}
.btn.on{background:rgba(255,207,74,.45)}
.btn.small{font-size:14px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 22px var(--f-jp);background:var(--panel);padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.sheet{position:fixed;inset:0;display:grid;place-items:start center;background:rgba(5,10,18,.74);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;overflow:auto}
.card{background:#101b2c;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:460px;width:100%;box-sizing:border-box;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h1{margin:0;font:800 24px/1.1 var(--f-jp)}
.card h1 small{display:block;font:600 12px var(--f-num);color:var(--sub);letter-spacing:.18em;margin-top:4px}
.langs{display:flex;gap:4px}
.langs button,.tabs button{appearance:none;border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:8px;padding:4px 8px;font:700 12px var(--f-jp);cursor:pointer}
.langs button.sel,.tabs button.sel{background:var(--gold);color:#1b1400;border-color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{padding:9px 4px;font-size:14px;position:relative}
.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.crs{appearance:none;border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:8px;color:var(--ink);text-align:left;display:grid;gap:2px;cursor:pointer;font-family:var(--f-jp);min-width:0}
.crs.sel{border-color:var(--gold)}
.crs b{font:800 13px var(--f-jp)}
.crs small{font-size:10px;color:var(--sub)}
.map{width:100%;height:auto;background:#0d1626;border-radius:12px;display:block}
.map .node{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:28px}
.chip{background:#1b2a40;border-radius:999px;padding:4px 10px;font:600 12px var(--f-jp)}
.chip.road{background:var(--sign)}
.chip.ex{background:var(--gold);color:#1b1400}
.arrow{color:var(--sub)}
.go{appearance:none;border:0;border-radius:12px;background:var(--gold);color:#1b1400;font:800 18px var(--f-jp);padding:12px;cursor:pointer}
.go:disabled{opacity:.4}
.go.sec{background:#1b2a40;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.garage{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.carc{appearance:none;border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:8px;color:var(--ink);text-align:left;display:grid;gap:3px;cursor:pointer;font-family:var(--f-jp);min-width:0}
.carc.sel{border-color:var(--gold)}
.carc b{font:800 13px var(--f-jp)}
.carc small{font-size:10px;color:var(--sub)}
.sw{height:6px;border-radius:3px}
.bar{display:grid;grid-template-columns:34px 1fr;gap:4px;align-items:center;font-size:9px;color:var(--sub)}
.bar i{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;display:block}
.bar em{display:block;height:100%;background:var(--gold)}
.spec{font:600 11px var(--f-num);color:var(--ink)}
.shop{display:grid;gap:6px}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:8px}
.item .sw{width:10px;height:100%;min-height:44px}
.item div{min-width:0}
.item b{font:800 14px var(--f-jp)}
.item small{display:block;font-size:10px;color:var(--sub)}
.price{text-align:right;display:grid;gap:4px;justify-items:end}
.price s{font:600 11px var(--f-num);color:var(--sub)}
.buy{appearance:none;border:0;border-radius:10px;background:var(--gold);color:#1b1400;font:800 13px var(--f-jp);padding:7px 12px;cursor:pointer}
.buy:disabled{background:#1b2a40;color:var(--sub)}
.dev{font:700 11px var(--f-jp);color:#1b1400;background:#7fe0a8;border-radius:6px;padding:2px 8px;justify-self:start}
.club{display:grid;gap:8px}
.box{background:#0d1626;border-radius:12px;padding:10px;display:grid;gap:6px}
.boxh{display:flex;justify-content:space-between;align-items:baseline;font:800 13px var(--f-jp)}
.mut{color:var(--sub);font:500 11px var(--f-jp)}
.live{font:600 11px var(--f-jp);color:#4cd18a}
.board{margin:0;padding:0 0 0 18px;font-size:12px;display:grid;gap:2px}
.board b{font:700 13px var(--f-num);font-variant-numeric:tabular-nums}
.msgs{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:150px;overflow:auto;font-size:12px}
.msgs li{background:var(--tile);border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
.msgs li span{color:var(--sub);font-size:10px;margin-right:6px}
.msgs li.me{background:#1d3550}
.sendF{display:flex;gap:6px}
.sendF input{flex:1;min-width:0;background:var(--tile);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px;font:500 14px var(--f-jp)}
.sendF .go{padding:8px 14px;font-size:14px}
.big{font:800 54px/1 var(--f-jp);text-align:center}
.stars{font-size:34px;text-align:center;letter-spacing:6px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats div{background:var(--tile);border-radius:10px;padding:6px}
.stats b{display:block;font:700 22px var(--f-num)}
.stats span{font-size:11px;color:var(--sub)}
.keys{font-size:11px;color:var(--sub);text-align:center}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast,.flash{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <div class="tl"><div class="limit" id="lim">80</div>
    <button class="rb" id="mapBtn" aria-label="map">🗺</button>
    <button class="rb" id="scrBtn" aria-label="screen">🖥</button>
    <button class="rb on" id="sndBtn" aria-label="sound">♪</button>
    <button class="rb" id="chatBtn" aria-label="chat"><span>💬</span><i class="dot" id="chatDot" hidden></i></button></div>
  <div class="tr"><div class="taxiM" id="taxiM" hidden></div><div id="tm">0:00</div><span><span data-t="hits"></span> <b id="hits">0</b> ・ <span data-t="viol"></span> <b id="viol">0</b></span>
    <div class="meter"><span data-t="body"></span><i><em id="mHp"></em></i></div>
    <div class="meter"><span data-t="heat"></span><i><em id="mHeat"></em></i></div>
    <div class="meter"><span id="enLb"></span><i><em id="mEn"></em></i></div>
    <div class="meter"><span data-t="sleepy"></span><i><em id="mSl"></em></i></div></div>
  <div class="nav" id="nav"><div class="ar" id="navAr">↑</div><div><div class="nm" id="navNm">-</div><div class="ds" id="navDs"></div><div class="lanes" id="lanes"></div><div class="cw" id="navCw" hidden></div></div></div>
  <div class="screen" id="screen" hidden>
    <div class="sctabs" id="sctabs"><button data-sc="car" data-t="scCar"></button><button data-sc="energy" data-t="scEnergy"></button><button data-sc="nav" data-t="scNav"></button><button data-sc="map" data-t="scMap"></button><button data-sc="chat" data-t="scChat"></button><button data-sc="x" aria-label="close">✕</button></div>
    <div class="scp" id="sc-car"><div class="mut" id="scCarHint"></div><div class="scars" id="scCars"></div></div>
    <div class="scp" id="sc-energy" hidden><div class="ebig"><b id="ePct">0%</b><span id="eKind"></span></div><div class="ebar"><em id="eBar"></em></div><div class="egrid"><div><span data-t="range"></span><b id="eRange"></b></div><div><span data-t="nextSt"></span><b id="eNext"></b></div></div><div class="mut" data-t="stHow"></div></div>
    <div class="scp" id="sc-nav" hidden><div class="navs" id="navList"></div></div>
    <div class="scp" id="sc-map" hidden><div class="boxh"><span id="mapTitle"></span><span class="live" id="mapLive"></span></div><svg class="map" id="liveMap" viewBox="0 0 360 70"></svg><div class="mut" data-t="pickOnMap"></div></div>
    <div class="scp" id="sc-chat" hidden><div class="mut" id="chatHint2"></div><ul class="msgs" id="msgs2"></ul>
      <form class="sendF" id="chatF2"><input id="chatIn2" maxlength="80" autocomplete="off"><button class="go" data-t="send"></button></form></div>
  </div>
</div>
<div class="ctrl" id="ctrl" hidden>
  <div class="grp"><div class="btn" id="bL">◀</div><div class="btn" id="bR">▶</div></div>
  <div class="grp"><div class="btn small" id="bB" data-t="brake"></div><div class="btn small" id="bA" data-t="accel"></div></div>
</div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<div class="sheet" id="menu">
  <div class="card">
    <div class="top"><h1>漢江ハイウェイ<small>SEOUL DRIVE · DEV</small></h1>
      <div class="langs" id="langs"><button data-l="ja">日本語</button><button data-l="ko">한국어</button><button data-l="en">EN</button></div></div>
    <div class="acct" id="acct"></div>
    <div class="tabs" id="tabs"><button data-tab="run" data-t="tabRun"></button><button data-tab="shop" data-t="tabShop"></button><button data-tab="club"><span data-t="tabClub"></span></button></div>
    <section id="tab-run" style="display:grid;gap:10px">
      <div class="courses" id="courses" hidden></div>
      <svg class="map" id="map" viewBox="0 0 360 120" role="img"></svg>

function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const f=W<H?W*0.56:Math.min(W*0.42,H*0.9);F=f/CAMD;HY=Math.round(H*(W<H?0.40:0.42));cockCache=null}

// ---------- rng ----------
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
const hash=str=>{let h=2166136261;for(const ch of str)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0};

// ---------- track ----------
let segs=[],pending=null,sprCache={},cockCache=null;
const sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function newSeg(curve,env){const i=segs.length;const s={i,y:0,curve,bands:[],spr:[],env,split:false,p1:{},p2:{},clip:0};segs.push(s);return s}
function band(id,c,hw,kind){return{id,c,hw,kind}}
function curvePlan(seed,len,bias){
  const R=rng(seed),cv=new Float32Array(len);let i=m2s(40);
  while(i<len-m2s(80)){const l=m2s(140+R()*220),c=(R()<.5?-1:1)*(0.4+R()*1.2),gap=m2s(60+R()*140);
    for(let j=0;j<l&&i+j<len;j++)cv[i+j]=c*sstep(j/(l*.25))*sstep((l-j)/(l*.25));i+=l+gap}
  if(bias)for(let j=m2s(60);j<len;j++)cv[j]+=bias*sstep((j-m2s(60))/m2s(80));
  return cv}
function envAt(m){ // what lies beside the road at course distance m
  const w=course.water;
  if(w==='both')return m<course.bridgeTo?'bridge':'land';
  return w;
}
function sideSprites(s,R,mc,j,env,mR,oppL){
  if(j%m2s(42)===0){s.spr.push({k:'lamp2',x:mc-MHW()-350});s.spr.push({k:'lamp',x:mR+LW+450,f:-1})}
  if(env==='bridge'){if(j%m2s(25)===0){s.spr.push({k:'rail',x:oppL-120});s.spr.push({k:'rail',x:mR+LW+300})}return}
  if(j%m2s(36)===0&&R()<.8){
    if(env!=='R'&&env!=='bridge') s.spr.push({k:'apt'+(R()*4|0),x:mR+5600+R()*9000,w:5600,h:9000+R()*8000});
    if(env==='R'||env==='land') s.spr.push({k:'apt'+(R()*4|0),x:oppL-5600-R()*9000,w:5600,h:9000+R()*8000});
  }
  if(env==='L'&&j%m2s(28)===0&&R()<.7)s.spr.push({k:'tree',x:oppL-900-R()*3500});
  if(env==='R'&&j%m2s(28)===0&&R()<.7)s.spr.push({k:'tree',x:mR+LW+1100+R()*3500});
}
function buildSection(k,entry,mainId,c0,ghost){
  const node=course.nodes[k],R=rng(hash(course.id+k+entry)),mhw=MHW();
  const G=m2s(course.G),total=node?G+S_SPL+S_OVL:m2s(GOALM+600);
  const cvp=curvePlan(hash(course.id+':'+k),node?G-m2s(330):total,course.bias);
  const start=segs.length, rampId=node?'r'+k:null, D=LW*9, baseM=k*secLen(course);
  const mc=c0, mR=mc+mhw, mL=mc-mhw, oppC=mL-700-mhw, oppL=oppC-mhw;
  const rest=k%2===1, tl=course.toll&&course.toll.k===k?course.toll:null;
  for(let j=0;j<total;j++){
    const m=baseM+j*1.2, env=envAt(m);
    const s=newSeg(j<cvp.length?cvp[j]:0,{t:env,oppL,mR});
    s.bands.push(band(mainId,mc,mhw,'main'));
    s.bands.push(band('opp',oppC,mhw,'opp'));
    if(ghost&&j<m2s(170)){const q=j/m2s(170);s.bands.push(band(ghost.id,ghost.c+ghost.dir*(q*q*40*LW+q*4*LW),ghost.hw,'ghost'))}
    if(entry==='main'&&j>=m2s(120)&&j<m2s(330)){const q=(j-m2s(120))/m2s(210);const hw=LW/2*(q<.68?sstep(q/.08):1-sstep((q-.68)/.32));if(hw>4)s.bands.push(band('mg'+start,mR+hw,hw,'merge'));
      if(j===m2s(170))s.spr.push({k:'merge',x:mR+LW*1.3})}
    if(j>=m2s(430)&&j<m2s(680)){const q=(j-m2s(430))/m2s(250);const hw=LW/2*Math.min(sstep(q/.16),1-sstep((q-.84)/.16));if(hw>4)s.bands.push(band('st'+start,mR+hw,hw,'station'));if(hw>LW/2-1){if(rest)s.rest=true;else s.station=true}
      if(rest){if(j===m2s(520))s.spr.push({k:'bench',x:mR+LW+700});if(j===m2s(600))s.spr.push({k:'wc',x:mR+LW+1100})}
      else{if(j===m2s(520))s.spr.push({k:'pump',x:mR+LW+700});if(j===m2s(590))s.spr.push({k:'charger',x:mR+LW+700})}}
    if(j===m2s(250))s.spr.push({k:rest?'rsign':'stsign',x:mR+500});
    if(tl){const jt=m2s(tl.m);if(j>=jt-m2s(250)&&j<=jt+m2s(20)){s.toll=1;s.td=(jt-j)*1.2}
      if(j===jt)s.spr.push({k:'tollgate',x:mc});if(j===jt-m2s(600))s.spr.push({k:'tollsign',x:mR+500})}
    if(node){
      if(j>=G-m2s(300)&&j<G){const hw=LW/2*sstep((j-(G-m2s(300)))/m2s(60));if(hw>4)s.bands.push(band(rampId,mR+hw,hw,'aux'))}
      else if(j>=G){const q=Math.min(1,(j-G)/S_SPL);s.bands.push(band(rampId,mR+LW/2+D*sstep(q)*.999+D*0.001*q,LW/2,'ramp'));if(j<G+S_SPL)s.split=true}
      const dist=G-j;
      if(dist===m2s(1000)||dist===m2s(500)) s.spr.push({k:'gantry',x:mc,node,dist:dist===m2s(1000)?'1km':'500m'});
      if(dist===m2s(25)) s.spr.push({k:'gexit',x:mR+LW/2,node});
      if(dist===m2s(300)||dist===m2s(200)||dist===m2s(100)) s.spr.push({k:'cnt'+(dist/m2s(100)|0),x:mR+LW+500});
      if(j===G) s.spr.push({k:'cushion',x:mR+LW/2+70});
      if(node.br&&j===G+m2s(200)) s.spr.push({k:'bridge',x:mc-20000,c:mc});
    } else {
      if(j===m2s(200)) s.spr.push({k:'gend',x:mc});
      if(j===m2s(GOALM)) s.spr.push({k:'goal',x:mc});
    }
    if(course.id==='icn'&&k===0&&(j===m2s(1500)||j===m2s(2200))) s.spr.push({k:'pylon',x:mc-700-mhw/2});
    if(j===m2s(60)) s.spr.push({k:'lim'+course.limit,x:mR+500});
    if(j===m2s(260)) s.spr.push({k:'camw',x:mR+500});
    if(j===m2s(420)){s.spr.push({k:'cam',x:mR+380});s.cam=true}
    sideSprites(s,R,mc,j,env,mR,oppL);
  }
  pending=node?{gore:start+G,end:start+G+S_SPL,node,k,rampId,mainId,mc,rampC:mc+mhw+LW/2+D}:{gore:Infinity,end:Infinity,goal:start+m2s(GOALM)};
}
function buildFiller(id,c,ghost){
  const start=segs.length;
  for(let j=0;j<m2s(500);j++){const s=newSeg(j>m2s(60)&&j<m2s(300)?1.4*sstep((j-m2s(60))/m2s(60)):0,{t:'land',oppL:-1e7,mR:c+LW/2});s.bands.push(band(id,c,LW/2,'main'));
    if(ghost&&j<m2s(170)){const q=j/m2s(170);s.bands.push(band(ghost.id,ghost.c+ghost.dir*(q*q*40*LW+q*4*LW),ghost.hw,'ghost'))}
    if(j%m2s(42)===0){s.spr.push({k:'lamp',x:c-LW/2-400,f:1});s.spr.push({k:'lamp',x:c+LW/2+400,f:-1})}}
  pending={gore:Infinity,end:Infinity,decided:true};
}

  let v=kmh2u(lim*(.65+Math.random()*.3)+(b.kind==='main'?(-lane)*5+12:-15));

  for(const c of st.cars)if(Math.abs(c.z-z)<1800&&c.band===b.id&&Math.abs(c.off-off)<LW*.6)return;

function spawnInit(){for(let i=0;i<12;i++)spawnCar(true);for(const c of st.cars)c.z-=Math.random()*m2s(120)*SEG}
function updateCars(dt){
  const pz=st.pos+PLZ;
  for(let i=st.cars.length-1;i>=0;i--){
    const c=st.cars[i];const s=segs[Math.floor(c.z/SEG)];let b=bandOf(s,c.band);
    if(!b||c.z<pz-m2s(90)*SEG||c.z>pz+m2s(250)*SEG){st.cars.splice(i,1);continue}
    if(b.kind==='merge'&&b.hw<LW*.42){const m=s.bands.find(q=>q.kind==='main');if(m){c.band=m.id;c.off=c.x-m.c;c.toff=m.hw-LW/2;b=m}}
    let lim=c.v;if(s.toll)lim=Math.min(lim,kmh2u(35));
    for(const o of st.cars){if(o===c)continue;const dz=o.z-c.z;if(dz>0&&dz<1600&&Math.abs(o.x-c.x)<LW*.6)lim=Math.min(lim,o.cur||o.v)}
    const dzp=pz-c.z;if(dzp>0&&dzp<1500&&Math.abs(st.px-c.x)<LW*.6)lim=Math.min(lim,st.v);
    c.cur=c.cur==null?c.v:c.cur+(lim-c.cur)*Math.min(1,dt*3);
    c.z+=c.cur*dt;c.off+=(c.toff-c.off)*Math.min(1,dt*1.2);c.x=b.c+c.off;
  }
  if(st.cars.length<15&&Math.random()<dt*2.4)spawnCar(Math.random()<.85);
  // oncoming carriageway
  for(let i=st.opp.length-1;i>=0;i--){const o=st.opp[i];o.z-=o.v*dt;const s=segs[Math.floor(o.z/SEG)];const b=bandOf(s,'opp');if(!b||o.z<st.pos-300){st.opp.splice(i,1);continue}o.x=b.c+o.off}
  if(st.opp.length<10&&Math.random()<dt*3){const z=st.pos+(m2s(170)+Math.random()*m2s(30))*SEG;const s=segs[Math.floor(z/SEG)];const b=bandOf(s,'opp');
    if(b){const n=Math.round(b.hw*2/LW),lane=Math.random()*n|0;st.opp.push({z,off:b.hw-LW/2-lane*LW,x:0,v:kmh2u(course.limit*(.7+Math.random()*.35)),col:COLS[Math.random()*COLS.length|0],model:pickModel()})}}
}

// ---------- update ----------
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1400)}
function update(dt){
  if(!st.running)return;
  st.time+=dt;
  const pIdx=Math.floor((st.pos+PLZ)/SEG), ps=segs[pIdx];
  if(!ps){finish();return}
  const lim=course.limit;
  let vm=st.v/PM;const acc=physics(st.car,st,vm,inp.a,inp.b,dt);vm=Math.max(0,vm+acc*dt);st.v=vm*PM;
  st.acc+=((vm>0?acc:0)-st.acc)*Math.min(1,dt*4);
  st.top=Math.max(st.top,u2kmh(st.v));
  const sp=Math.min(1.5,st.v/kmh2u(130));
  const steer=(inp.r-inp.l);
  st.wheel+=(steer*1.1-st.wheel)*Math.min(1,dt*6);
  st.px+=st.wheel*dt*LW*1.8*Math.max(.35,Math.sqrt(sp));
  st.px-=ps.curve*Math.min(2.2,sp*sp)*dt*300;
  const mine=bandOf(ps,st.mine);
  if(mine){
    let Lo=mine.c-mine.hw,Rr=mine.c+mine.hw;
    for(const b of ps.bands){if(b.kind==='merge'||b.kind==='station')Rr=Math.max(Rr,b.c+b.hw)}
    if(pending&&st.mine===pending.mainId&&!pending.decided){const a=ps.bands.find(b=>b.kind==='aux');if(a)Rr=Math.max(Rr,a.c+a.hw)}
    const lo=Lo+120,hi=Rr-120;
    if(st.px<lo||st.px>hi){st.px=Math.max(lo,Math.min(hi,st.px));st.v*=1-dt*1.2;st.shake=.25;dmg(dt*u2kmh(st.v)*.12)}
  }
  st.pos+=st.v*dt;
  if(st.taxi){const kmh=u2kmh(st.v);st.taxiEq+=kmh>=15?st.v*dt/PM:dt*131/30}
  st.bgx+=ps.curve*sp*dt*0.006;
  if(pending&&!pending.decided&&pIdx>=pending.gore){
    const p=pending,took=st.px>p.mc+MHW();
    p.decided=true;
    const want=target?target.k===p.k:took;
    let outcome=null;
    if(!target){if(took)outcome='freeexit'}
    else if(took!==want) outcome=took?'wrong':'missed';
    else if(took) outcome='ok';
    if(took){st.exitK=p.k;st.mine=p.rampId;buildFiller(p.rampId,p.rampC,{id:p.mainId,c:p.mc,hw:MHW(),dir:-1})}
    else buildSection(p.k+1,'main',p.mainId,p.mc,{id:p.rampId,c:p.rampC,hw:LW/2,dir:1});
    if(outcome){st.done=outcome;st.endAt=p.end+m2s(30)}
  }
  if(st.done&&pIdx>=st.endAt)finish();
  if(pending&&pending.goal&&pIdx>=pending.goal&&!st.done){st.done=target?'missed':'goal';finish()}
  if(ps.cam&&st.lastCam!==pIdx){st.lastCam=pIdx;if(u2kmh(st.v)>lim+10){st.viol++;$('flash').style.opacity=.85;setTimeout(()=>$('flash').style.opacity=0,120);toast(t('speedViol'))}}
  updateCars(dt);
  st.hitCd-=dt;
  const pz=st.pos+PLZ;
  for(const c of st.cars){
    const dz=c.z-pz,dx=c.x-st.px,len=shapeOf(c.model)==='lorry'?1600:760;
    if(Math.abs(dx)<330&&dz>-len*.5&&dz<len*.6){
      if(st.hitCd<=0){st.hits++;st.hitCd=1;const rel=Math.abs(u2kmh(st.v-c.cur));dmg(Math.max(4,rel*.6));toast(rel>60?t('crashB'):t('crashS'));st.shake=.4+Math.min(.6,rel/100)}
      if(dz>0){st.v=Math.min(st.v,c.cur*.8);st.pos=Math.min(st.pos,c.z-PLZ-len*.6)}
      else c.cur=Math.min(c.cur,st.v*.8);
      st.px+=dx>0?-40:40;
    }
  }
  // fuel station: stop in the station lane to refuel / charge
  const sb=ps.bands.find(b=>b.kind==='station'&&b.hw>LW/2-1);
  st.fueling=0;
  if(sb&&ps.rest&&st.px>sb.c-sb.hw&&u2kmh(st.v)<5&&!inp.a){st.sleep=Math.max(0,st.sleep-dt*14);st.fueling=3;st.sleepWarn=false}
  else if(sb&&st.px>sb.c-sb.hw&&u2kmh(st.v)<5&&!inp.a){const car=st.car,cap=capKwh(car);
    const kw=car.ev?Math.min(car.chg,car.chg*(1.15-st.energy/cap))*10:40/60*KWH_L[car.fuel]*3600/1;  // EV: time-lapse x10 ; pump 40 L/min
    st.energy=Math.min(cap,st.energy+kw*dt/3600);st.fueling=car.ev?2:1;st.lowWarn=false}
  // drowsiness
  if(u2kmh(st.v)>20)st.sleep=Math.min(100,st.sleep+dt*.4);
  if(st.sleep>70&&!st.sleepWarn){st.sleepWarn=true;toast(t('drowsy'))}
  if(st.sleep>60)st.px+=Math.sin(st.time*.7)*dt*LW*.3*(st.sleep-60)/40;
  // toll plaza
  if(ps.toll){const mb=ps.bands.find(b=>b.kind==='main'),fee=course.toll.fee;st.tollLane=mb?Math.floor((st.px-(mb.c-mb.hw))/LW):0;const hip=st.tollLane<Math.ceil(NL()/2),kmh=u2kmh(st.v);
    if(!hip&&kmh<5&&ps.td>=0&&ps.td<30&&!st.tollPaid){st.tollPaid=true;st.tollSum+=fee;toast(t('paid')(fee))}
    if(ps.td<=0&&!st.boothDone){st.boothDone=true;
      if(hip&&!hasOpt('hipass')){st.viol++;toast(t('noHipass'))}
      else if(hip){st.tollSum+=fee;navBeep(1320);toast(t('hipassPay')(fee));if(kmh>50){st.viol++;toast(t('hipassFast'))}}
      else if(!st.tollPaid){st.hits++;dmg(10);st.v*=.4;st.shake=.4;toast(t('tollBar'))}}}
  else{st.boothDone=false;st.tollPaid=false}
  const ep=st.energy/capKwh(st.car);
  if(ep<.1&&!st.lowWarn){st.lowWarn=true;toast(t('lowFuel'))}
  if(st.energy<=0&&st.v<PM*.5&&!st.done){st.done='empty';finish();return}
  st.shake=Math.max(0,st.shake-dt);
  hud(pIdx);
}

// ---------- render ----------
const SIDE=b=>b.kind==='aux'||b.kind==='merge'||b.kind==='station';
function proj(p,cx,cy,cz){cz=Math.max(cz,30);p.s=CAMD/cz;p.k=-cx;p.y=HY-p.s*cy*F;p.z=cz}
const SX=(p,X)=>W/2+p.s*(X+p.k)*F;
function quad(x1,y1,x2,y2,x3,y3,x4,y4,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill()}
function strip(p1,p2,a1,a2,b1,b2,col){quad(SX(p1,a1),p1.y,SX(p1,b1),p1.y,SX(p2,b2),p2.y,SX(p2,a2),p2.y,col)}
function render(){
  ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
  const HY0=HY,vk=u2kmh(st.v),run=st.running;
  const pitch=run?Math.max(-18,Math.min(18,(st.acc||0)*2.6)):0, roll=run?-(st.wheel||0)*Math.min(1,vk/120)*.025:0;
  const vib=run?(Math.random()-.5)*Math.min(2.2,vk/70):0;
  HY=HY0+pitch+vib;
  ctx.save();ctx.translate(W/2,HY);ctx.rotate(roll);ctx.translate(-W/2,-HY);
  drawBg();
  renderWorld();
  ctx.restore();HY=HY0;
  ctx.save();ctx.translate(0,vib*.5+pitch*.15);drawCockpit();ctx.restore();
  if(run&&st.sleep>60){const k=(st.sleep-60)/40,per=6-3*k,ph=(st.time%per)/per,cl=ph<.12?Math.sin(ph/.12*Math.PI):0,e=Math.min(1,cl*(.55+.45*k));
    ctx.fillStyle=`rgba(0,0,0,${.15*k})`;ctx.fillRect(0,0,W,H);if(e>0){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H/2*e);ctx.fillRect(0,H-H/2*e,W,H/2*e)}}
}
function renderWorld(){
  const base=Math.floor(st.pos/SEG),bp=(st.pos%SEG)/SEG;
  if(!segs[base])return;
  const camY=CAMH;
  const shake=st.shake?(Math.random()-.5)*st.shake*30:0;
  const camX=st.px-0.37*PM+shake;
  let x=0,dx=-(segs[base].curve*bp),maxy=H;
  const vis=[];
  ctx.fillStyle='#141c2a';ctx.fillRect(0,HY,W,H-HY);
  for(let n=0;n<DRAW;n++){
    const s=segs[base+n];if(!s)break;const s2=segs[base+n+1]||s;
    const z1=(s.i*SEG)-st.pos,z2=z1+SEG;
    proj(s.p1,camX-x,-camY,z1);proj(s.p2,camX-x-dx,-camY,z2);
    x+=dx;dx+=s.curve;
    s.clip=maxy;vis.push(s);
    if(s.p2.y>=s.p1.y||s.p2.y>=maxy)continue;
    const p1=s.p1,p2=s.p2,y1=Math.min(p1.y,H),y2=p2.y;
    const alt=Math.floor(s.i/4)%2,e=s.env;
    ctx.fillStyle=alt?'#151d2b':'#18212f';ctx.fillRect(0,y2,W,y1-y2+1);
    const wc=alt?'#1d3c63':'#22466f',pc=alt?'#14241a':'#17291e';
    if(e.t==='L'){strip(p1,p2,e.oppL-4e5,e.oppL-4e5,e.oppL-5200,e.oppL-5200,wc);strip(p1,p2,e.oppL-5200,e.oppL-5200,e.oppL-260,e.oppL-260,pc)}
    else if(e.t==='R'){strip(p1,p2,e.mR+LW+5200,e.mR+LW+5200,e.mR+4e5,e.mR+4e5,wc);strip(p1,p2,e.mR+LW+260,e.mR+LW+260,e.mR+LW+5200,e.mR+LW+5200,pc)}
    else if(e.t==='bridge'){strip(p1,p2,e.oppL-4e5,e.oppL-4e5,e.oppL-300,e.oppL-300,wc);strip(p1,p2,e.mR+LW+400,e.mR+LW+400,e.mR+4e5,e.mR+4e5,wc)}
    const bs=s.bands;
    const pair=b=>bandOf(s2,b.id)||b;
    for(const b of bs){const q=pair(b);strip(p1,p2,b.c-b.hw-260,q.c-q.hw-260,b.c+b.hw+260,q.c+q.hw+260,SIDE(b)?'#3a4352':'#4a5363')}
    for(const b of bs){const q=pair(b);const ext=SIDE(b)?30:0;strip(p1,p2,b.c-b.hw-ext,q.c-q.hw-ext,b.c+b.hw,q.c+q.hw,alt?'#2b313b':'#2f353f')}
    if(s.split){const a=bs[0],b=bs.find(q=>q.kind==='ramp');if(b){const ta=pair(a),tb=pair(b);strip(p1,p2,a.c+a.hw,ta.c+ta.hw,b.c-b.hw,tb.c-tb.hw,alt?'#e8e8e8':'#3a3f48')}}
    if(n<140){
      const lw=60,dash=Math.floor(s.i/5)%2===0,hasSide=bs.some(SIDE);
      for(const b of bs){const q=pair(b);
        if(SIDE(b)){if(b.kind==='station'){strip(p1,p2,b.c-b.hw+40,q.c-q.hw+40,b.c+b.hw-40,q.c+q.hw-40,alt?'#2c3f36':'#30443a')}strip(p1,p2,b.c+b.hw-lw,q.c+q.hw-lw,b.c+b.hw,q.c+q.hw,'#e9edf2');continue}
        const yl=b.kind==='main',yr=b.kind==='opp';
        strip(p1,p2,b.c-b.hw,q.c-q.hw,b.c-b.hw+lw,q.c-q.hw+lw,yl?'#f2c94c':'#e9edf2');
        if(!(hasSide&&b.kind==='main')||!dash) strip(p1,p2,b.c+b.hw-lw,q.c+q.hw-lw,b.c+b.hw,q.c+q.hw,yr?'#f2c94c':'#e9edf2');

// ---------- sound: engine by rpm, wind and tyre noise by speed (WebAudio, starts on a tap) ----------
const SND={ctx:null,on:true};
function sndStart(){
  if(SND.ctx||!SND.on)return;
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();SND.ctx=a;
    const master=a.createGain();master.gain.value=.5;master.connect(a.destination);SND.master=master;
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(master);
    const eg=a.createGain();eg.gain.value=0;eg.connect(lp);
    const o1=a.createOscillator(),o2=a.createOscillator();o1.type='sawtooth';o2.type='square';o1.connect(eg);const g2=a.createGain();g2.gain.value=.35;o2.connect(g2);g2.connect(eg);o1.start();o2.start();
    const buf=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=a.createBufferSource();ns.buffer=buf;ns.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.6;const wg=a.createGain();wg.gain.value=0;ns.connect(bp);bp.connect(wg);wg.connect(master);ns.start();
    Object.assign(SND,{o1,o2,eg,wg,bp,lp});
  }catch(e){SND.ctx=null}
}
function sndTick(){
  if(!SND.ctx)return;const a=SND.ctx,now=a.currentTime,on=SND.on&&st.running;
  const car=st.car||CARS[carIdx],ev=car.hev&&u2kmh(st.v)<35&&!inp.a;
  const rpm=st.rpm||0,base=car.shape==='porter'?28:car.kw>200?40:34;
  const isEv=car.ev;SND.o1.type=isEv?'sine':'sawtooth';
  const f=isEv?120+u2kmh(st.v)*9:ev?0:base+rpm*(car.gears?150:120)*(inp.a?1:.85);
  SND.o1.frequency.setTargetAtTime(Math.max(20,f),now,.05);SND.o2.frequency.setTargetAtTime(Math.max(20,f*.5),now,.05);
  SND.lp.frequency.setTargetAtTime(500+rpm*1400*(inp.a?1:.6),now,.08);
  SND.eg.gain.setTargetAtTime(on&&!ev?(isEv?(inp.a?.03:.012)*Math.min(1,u2kmh(st.v)/20):(inp.a?.09:.045))*(st.hp>0?1:0):0,now,.08);
  const v=u2kmh(st.v)/200;SND.wg.gain.setTargetAtTime(on?Math.min(.22,v*v*.25+v*.03):0,now,.1);SND.bp.frequency.setTargetAtTime(400+v*900,now,.1);

// ---------- results ----------
function finish(){
  if(!st.running)return;st.running=false;
  const ok=st.done==='ok'||st.done==='freeexit'||st.done==='goal';
  $('rIcon').textContent=st.done==='broken'?'💥':ok?'✓':'✕';$('rIcon').style.color=ok?'var(--gold)':'var(--red)';
  $('rMsg').textContent=st.done==='ok'?t('arrivedAt')(L(course.nodes[target.k].n)):t(st.done||'missed');
  const pen=st.hits+st.viol*2;const stars=st.done==='ok'?(pen===0?3:pen<=2?2:1):0;
  $('rStars').textContent=target?'★'.repeat(stars)+'☆'.repeat(3-stars):'';
  $('rTime').textContent=fmt(st.time);$('rHit').textContent=st.hits;$('rViol').textContent=st.viol;
  $('rTop').textContent=Math.round(st.top);$('rHp').textContent=Math.round(st.hp);$('rDist').textContent=(st.pos/PM/1000).toFixed(1);if(st.tollSum)toast(t('tollTotal')(st.tollSum));
  if(st.done==='ok'){try{const kk='hk-hwy-best-'+course.id+target.k,b=+localStorage.getItem(kk)||0;if(stars>b)localStorage.setItem(kk,stars)}catch(e){}}
  if(st.taxi){const okT=st.done==='ok'||(st.done==='goal'&&!target);const fare=taxiFare(),pay=okT?fare+st.tollSum:0;
    if(pay){CASH=Math.round((CASH+pay/KRW)*100)/100;try{localStorage.setItem('hk-hwy-usd',CASH)}catch(e){}if(typeof saveAcct==='function')saveAcct()}
    $('rIcon').textContent=okT?'🚕':'✕';$('rMsg').textContent=okT?t('taxiPaid')(pay,fare,st.tollSum):t('taxiFail');$('rStars').textContent=okT?t('wallet')+' '+usd2(CASH):''}
  $('result').hidden=false;$('hud').hidden=true;$('ctrl').hidden=true;$('screen').hidden=true;
  // where am I now? exited at an IC -> re-enter there next time; reached the end -> a connected road
  {const ci=COURSES.indexOf(course),ex=st.exitK;
   if(ex!=null)LOC={c:ci,k:Math.min(ex+1,course.nodes.length)};
   else if(st.done==='goal'){const nx=COURSES.findIndex(c=>c.id===NEXTC[course.id]);LOC=nx>=0?{c:nx,k:0}:randLoc()}
   else LOC={c:ci,k:pending&&pending.k!=null?pending.k:startK};
   saveLoc()}
  saveFuel();saveRun();
}

  const rows=Object.entries(NET.runs).map(([id,d])=>[id,d||{}]);
  const tm=rows.filter(r=>r[1].best&&r[1].best[course.id]).sort((a,b)=>a[1].best[course.id]-b[1].best[course.id]).slice(0,5);
  const tp=rows.filter(r=>r[1].top).sort((a,b)=>b[1].top-a[1].top).slice(0,5);
  const nm=await names([...new Set([...tm,...tp].map(r=>r[0]))]);
  const car=i=>CARS[i]?L(CARS[i].name):'';
  $('bTime').innerHTML=`<li class="mut" style="list-style:none;margin-left:-18px">${t('best')}</li>`+(tm.map(r=>`<li><b>${fmt(r[1].best[course.id])}</b> ${esc(nm[r[0]]||t('someone'))} <span class="mut">${esc(car(r[1].bestCar&&r[1].bestCar[course.id]))}</span></li>`).join('')||`<li class="mut">${t('none')}</li>`);
  $('bTop').innerHTML=`<li class="mut" style="list-style:none;margin-left:-18px">${t('topSp')}</li>`+(tp.map(r=>`<li><b>${Math.round(r[1].top)}</b> ${esc(nm[r[0]]||t('someone'))} <span class="mut">${esc(car(r[1].topCar))}</span></li>`).join('')||`<li class="mut">${t('none')}</li>`);
}
function flat(src){const all=[];for(const [id,d] of Object.entries(src))for(const it of ((d&&d.items)||[]))if(it&&it.text)all.push({id,t:+it.t||0,text:String(it.text)});return all.sort((a,b)=>a.t-b.t)}
async function drawMsgs(){
  const ch=flat(NET.chat).slice(-40),nt=flat(NET.notes).slice(-20).reverse();
  const nm=await names([...new Set([...ch,...nt].map(a=>a.id))]);
  const li=a=>`<li class="${a.id===NET.me?'me':''}"><span>${esc(nm[a.id]||t('someone'))}</span>${esc(a.text)}</li>`;
  const empty=`<li class="mut">${t('none')}</li>`;
  $('msgs').innerHTML=ch.map(li).join('')||empty;$('msgs2').innerHTML=ch.slice(-8).map(li).join('')||empty;
  $('notes').innerHTML=nt.map(li).join('')||empty;
  for(const id of ['msgs','msgs2'])$(id).scrollTop=1e6;
}
async function postTo(col,input,max,keep){
  const tx=input.value.trim();if(!tx||!NET.db||!NET.me)return;
  try{const ref=NET.db.doc(col+'/'+NET.me);const d=(await ref.get()).data()||{};const items=[...(d.items||[]),{t:Date.now(),text:tx.slice(0,max)}].slice(-keep);await ref.set({items});input.value='';toast(t('sent'))}
  catch(e){toast(t('sendFail'))}
}
$('chatF').addEventListener('submit',e=>{e.preventDefault();postTo('chat',$('chatIn'),80,20)});
$('chatF2').addEventListener('submit',e=>{e.preventDefault();postTo('chat',$('chatIn2'),80,20)});
$('noteF').addEventListener('submit',e=>{e.preventDefault();postTo('notes',$('noteIn'),120,5)});
function netState(key,on){NET.stateKey=key;NET.stateOn=on;const msg=key?t(key):'';for(const id of ['chatHint','chatHint2'])$(id).textContent=msg;for(const id of ['chatIn','chatIn2','noteIn'])$(id).disabled=!on;for(const f of ['chatF','chatF2','noteF'])$(f).querySelector('button').disabled=!on}
async function saveRun(){
  if(!NET.db||!NET.me)return;
  const cur=NET.runs[NET.me]||{},nx={...cur,best:{...(cur.best||{})},bestCar:{...(cur.bestCar||{})}};let ch=false;
  if(st.done==='goal'&&!st.k0&&(!nx.best[course.id]||st.time<nx.best[course.id])){nx.best[course.id]=Math.round(st.time*10)/10;nx.bestCar[course.id]=carIdx;ch=true}
  if(st.top>(cur.top||0)+.5&&st.hp>0){nx.top=Math.round(st.top);nx.topCar=carIdx;ch=true}
  if(ch){nx.at=Date.now();try{await NET.db.doc('runs/'+NET.me).set(nx)}catch(e){}}
}
function drawLiveOn(svg,showNames,pick){
  svg.innerHTML='';const c=course,y=36,x0=16,x1=344,len=courseLen(c),X=m=>x0+(x1-x0)*Math.max(0,Math.min(1,m/len));
  el(svg,'line',{x1:x0,y1:y,x2:x1,y2:y,stroke:'#2f8f5b','stroke-width':6,'stroke-linecap':'round'});
  c.nodes.forEach((nd,k)=>{el(svg,'circle',{cx:X(goreM(c,k)),cy:y,r:3,fill:'#ffcf4a'});if(showNames)el(svg,'text',{x:X(goreM(c,k)),y:y+18+(k%2)*10,fill:'#93a6bb','font-size':8,'text-anchor':'middle'},L(nd.n))});
  el(svg,'text',{x:x0,y:y-12,fill:'#cfe3d8','font-size':9},L(c.from));el(svg,'text',{x:x1,y:y-12,fill:'#cfe3d8','font-size':9,'text-anchor':'end'},L(c.end));
  if(pick&&st.running){const cur=pending&&!pending.decided?pending.k:Infinity;
    c.nodes.forEach((nd,k)=>{if(k<cur)return;const nx=X(goreM(c,k)),sel=target&&target.k===k,g=el(svg,'g',{class:'node'});
      el(g,'circle',{cx:nx,cy:y,r:sel?9:7,fill:sel?'#ffcf4a':'#16233a',stroke:'#ffcf4a','stroke-width':2.5});
      el(g,'text',{x:nx,y:k%2?y+24:y-14,fill:sel?'#ffcf4a':'#eef3f8','font-size':9,'font-weight':700,'text-anchor':'middle'},L(nd.n));
      el(g,'circle',{cx:nx,cy:y,r:18,fill:'transparent'});g.style.cursor='pointer';
      g.addEventListener('click',()=>{if(st.taxi){toast(t('taxiLocked'));return}target=target&&target.k===k?null:{k};navBeep(880);toast(target?t('destSet')(L(nd.n)):t('destEnd')(L(c.end)));drawLive()})});
    if(cur!==Infinity){const g=el(svg,'g',{});el(g,'rect',{x:x1-8,y:y-8,width:16,height:16,fill:target?'#16233a':'#ffcf4a',stroke:'#fff','stroke-width':2});el(g,'rect',{x:x1-20,y:y-20,width:40,height:40,fill:'transparent'});g.style.cursor='pointer';g.addEventListener('click',()=>{if(st.taxi){toast(t('taxiLocked'));return}target=null;toast(t('destEnd')(L(c.end)));drawLive()})}}
  let n=0;for(const g of NET.ghosts.values()){if(g.c!==c.id)continue;n++;el(svg,'circle',{cx:X(g.p/PM),cy:y,r:6,fill:'#5aa9ff',stroke:'#fff','stroke-width':1.5})}
  if(st.running)el(svg,'circle',{cx:X(st.m0+st.pos/PM),cy:y,r:7,fill:'#ffcf4a',stroke:'#1b1400','stroke-width':2});
  return n;
}
function drawLive(){
  const n=drawLiveOn($('clubMap'),true);let all=0;for(const g of NET.ghosts.values())all++;
  $('liveCount').textContent=all?t('live')(all):'';
  if(scrOpen()&&SCR.tab==='map'){const k=drawLiveOn($('liveMap'),false,true);$('mapLive').textContent=k?t('live')(k):''}
}
netState('wait',false);
(async()=>{
  if(!window.claude||!window.claude.use){netState('offline',false);$('acct').textContent=t('guest');return}
  const [db,user,room]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('room')]);
  NET.db=db;NET.user=user;NET.room=room;
  if(user){try{NET.me=await user.id()}catch(e){}}
  if(db){
    const to=setTimeout(()=>netState('loadFail',false),10000);
    db.collection('runs').onSnapshot(sn=>{clearTimeout(to);NET.runs={};for(const d of sn.docs)NET.runs[d.id]=d.data()||{};drawBoards()},()=>clearTimeout(to));
    db.collection('chat').onSnapshot(sn=>{NET.chat={};let newest=0;for(const d of sn.docs){NET.chat[d.id]=d.data()||{};for(const it of (NET.chat[d.id].items||[]))if(d.id!==NET.me)newest=Math.max(newest,+it.t||0)}
      if(newest>NET.seen&&st.running&&!(scrOpen()&&SCR.tab==='chat'))$('chatDot').hidden=false;NET.seen=Math.max(NET.seen,newest);drawMsgs()},()=>{});
    db.collection('notes').onSnapshot(sn=>{NET.notes={};for(const d of sn.docs)NET.notes[d.id]=d.data()||{};drawMsgs()},()=>{});
    if(NET.me){netState('',true);
      try{const g=(await db.doc('data/users/'+NET.me+'/garage').get()).data();if(g&&Array.isArray(g.cars)){for(const i of g.cars)if(CARS[i])owned.add(i);
        if(g.spec)for(const k in g.spec)if(!SPEC[k]){SPEC[k]=g.spec[k];applySpec(+k)}
        if(g.paint)for(const k in g.paint)if(!PAINT[k]&&CARS[k]){PAINT[k]=g.paint[k];CARS[k].col=g.paint[k]}
        if(g.loc&&COURSES[g.loc.c]&&!st.running){LOC=g.loc;try{localStorage.setItem('hk-hwy-loc',JSON.stringify(LOC))}catch(e){}}
        if(typeof g.usd==='number'&&g.usd>CASH){CASH=g.usd;try{localStorage.setItem('hk-hwy-usd',CASH)}catch(e){}}
        if(g.fuel)for(const k in g.fuel)if(fuelPct[k]==null)fuelPct[k]=g.fuel[k];
        if(!st.running){useLoc();makeBg();idleReset()}drawAll()}}catch(e){}
      try{const me=await user.me();$('acct').textContent=t('loggedIn')(me&&me.name||t('someone'))}catch(e){}}
    else netState('login',false);
  } else netState('login',false);
  if(room){
    room.onPeers(()=>{for(const p of room.peers()){if(p.kind!=='viewer'||(p.isMe&&p.sameTab))continue;const pr=p.presence||{};
        if(typeof pr.p==='number'){const g=NET.ghosts.get(p.peer);if(!g||g.p!==pr.p)NET.ghosts.set(p.peer,{c:pr.c,p:pr.p,x:pr.x,v:pr.v||0,col:pr.col||'#fff',m:pr.m,t:performance.now()})}else NET.ghosts.delete(p.peer)}
      for(const k of [...NET.ghosts.keys()])if(!room.peers().some(p=>p.peer===k))NET.ghosts.delete(k);
      drawLive()});
  }
})();
function netTick(){
  const now=performance.now();if(now-NET.lastP<250)return;NET.lastP=now;
  if(NET.room){if(st.running)NET.room.presence({c:course.id,p:Math.round(st.pos+st.m0*PM),x:Math.round(st.px),v:Math.round(st.v),m:carIdx,col:st.car.col}).catch(()=>{});
    else if(NET.wasRunning)NET.room.presence({p:null}).catch(()=>{});NET.wasRunning=st.running}
  if(st.running&&scrOpen()&&(now-(SCR.last||0)>500)){SCR.last=now;drawScreen()}
}

// ---------- loop ----------
let last=performance.now();
function idleReset(){reset();st.running=false;st.v=kmh2u(70)}
resize();useLoc();makeBg();drawAll();idleReset();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000))*(window.__ts||1);last=now;
  if(st.running)update(dt);
  else if(!$('menu').hidden){st.pos+=st.v*dt;const s=segs[Math.floor((st.pos+PLZ)/SEG)];if(!s||(pending&&s.i>pending.gore-10)){idleReset()}else{st.bgx+=s.curve*.5*dt*.006;updateCars(dt)}}
  netTick();sndTick();
  render();
  requestAnimationFrame(frame);
}
document.fonts&&document.fonts.ready.then(()=>{sprCache={}});
window.__hwy={st,inp,CARS,CAR_SPEC,COURSES,setCar:i=>{carIdx=i;owned.add(i)},setCourse:i=>{course=COURSES[i];makeBg()},get segs(){return segs},get pending(){return pending},startGame,pickTarget:k=>{target={k}},setStart:k=>{startK=k},setLoc:(c,k)=>{LOC={c,k};useLoc();makeBg()},get taxi(){return TAXI}};
requestAnimationFrame(frame);
})();
