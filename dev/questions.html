<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>ゲームの質問 | TRIATHLON</title>
<style>
/* 開発企画：ゲームの質問。5問ずつ。答えはこの端末に保存し、コピーして送る */
:root{--bg:#F3F6F5;--card:#FBFCFC;--fg:#26323A;--mut:#5B6B73;--line:#D5DFDE;--accent:#22AAA6;--ainK:#0F2A2C;--mist:#DCF1EF;--blue:#2F6FB8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131B20;--card:#1B262C;--fg:#E3EBEA;--mut:#9DB0B3;--line:#2A3A42;--accent:#3CC4BF;--mist:#1F3A3B;--blue:#6FA3E0;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.8 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 64px;display:grid;gap:14px}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0}p{margin:0}.mut{color:var(--mut);font-size:13px}nav.dv a{color:var(--blue);font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:var(--card);color:var(--fg);cursor:pointer}
.tab.on{background:var(--accent);color:var(--ainK);border-color:var(--accent)}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px}
.q .n{font-size:12px;color:var(--mut)}
.opts{display:grid;gap:8px}.opts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opts input{margin-top:6px;accent-color:var(--accent)}.opts b{font-weight:700;display:block;line-height:1.5}.opts small{color:var(--mut);font-size:12px;line-height:1.4;display:block}
.opts label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--mist)}
input[type=text]{font:inherit;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--fg);width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 22px;background:var(--accent);color:var(--ainK);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q.dec{opacity:.92}.q.dec .ans{margin:.4em 0 0;padding:.6em .8em;border-left:4px solid var(--fg);background:rgba(127,127,127,.1);border-radius:6px}
</style>
<script src="return.js?v=20261101" defer></script></head><body>
<div class="wrap">
<nav class="dv"><a href="./">← 開発トップ</a></nav>
<div><h1>ゲームの質問</h1><p class="mut">5問ずつ。選ぶだけで、その場でこの端末に保存されます。終わったら「答えをコピー」を押して、チャットに貼ってください。</p></div>
<div class="tabs" id="tabs"></div>
<div id="qs" style="display:grid;gap:14px"></div>
<div class="row"><button class="btn" id="copy">答えをコピー</button><span class="mut" id="msg"></span></div>
</div>
<script src="questions.js?v=4"></script>
<script>
(function(){
'use strict';
var KEY='tri-questions-v1',Q=window.TRI_QUESTIONS||[],cur=0,A={};Q.forEach(function(s,i){if(s.id&&location.hash==='#'+s.id)cur=i});
try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function done(set){return set.q.filter(function(q){return q.dec||(A[q.id]&&A[q.id].v!=null)}).length}
function tabs(){$('tabs').innerHTML=Q.map(function(s,i){return '<button class="tab'+(i===cur?' on':'')+'" data-i="'+i+'">'+esc(s.title)+'（'+done(s)+'/'+s.q.length+'）</button>'}).join('');
 document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){cur=+b.dataset.i;render()}})}
function render(){tabs();var s=Q[cur];if(!s){$('qs').innerHTML='<p class="mut">いまは質問はありません。答えはすべて記録ずみです。</p>';return}
 $('qs').innerHTML=s.q.map(function(q,qi){var a=A[q.id]||{};
  if(q.dec)return '<section class="q dec"><span class="n">'+esc(s.title)+' '+(qi+1)+'／'+s.q.length+' · 決定済み</span><h2>'+esc(q.t)+'</h2><p class="ans">'+esc(q.dec)+'</p></section>';
  return '<section class="q"><span class="n">'+esc(s.title)+' '+(qi+1)+'／'+s.q.length+'</span><h2>'+esc(q.t)+'</h2>'+(q.note?'<p class="mut">'+esc(q.note)+'</p>':'')+
  '<div class="opts">'+q.o.map(function(o,oi){return '<label><input type="radio" name="'+q.id+'" value="'+oi+'"'+(a.v===oi?' checked':'')+'><span><b>'+esc(o[0])+'</b>'+(o[1]?'<small>'+esc(o[1])+'</small>':'')+'</span></label>'}).join('')+
  '<label><input type="radio" name="'+q.id+'" value="-1"'+(a.v===-1?' checked':'')+'><span><b>その他・ひとこと</b></span></label></div>'+
  '<input type="text" data-q="'+q.id+'" maxlength="200" placeholder="ひとこと（あれば）" value="'+esc(a.c||'')+'"></section>'}).join('');
 document.querySelectorAll('#qs input[type=radio]').forEach(function(r){r.onchange=function(){var id=r.name;A[id]=A[id]||{};A[id].v=+r.value;save();tabs()}});
 document.querySelectorAll('#qs input[type=text]').forEach(function(t){t.oninput=function(){var id=t.dataset.q;A[id]=A[id]||{};A[id].c=t.value;save()}})}
function text(){var out=['【ゲームの質問・答え】'];Q.forEach(function(s){s.q.forEach(function(q,i){var a=A[q.id];if(q.dec)return;if(!a||(a.v==null&&!a.c))return;var o=a.v>=0&&a.v!=null?q.o[a.v][0]:(a.v===-1?'その他':'');out.push(q.id+' '+q.t+' → '+o+(a.c?'（'+a.c+'）':''))})});return out.join('\n')}
$('copy').onclick=function(){var t=text();function ok(){$('msg').textContent='コピーしました。チャットに貼ってください。'}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){fallback(t)});else fallback(t)};
function fallback(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');$('msg').textContent='コピーしました。チャットに貼ってください。'}catch(e){$('msg').textContent='コピーできませんでした。'}document.body.removeChild(ta)}
render();
})();
</script></body></html>
