<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TRIATHLON の世界のお店。ゲームの中のお金「灯貨」で買い物できます。">
<title>トライアスロンモール | TRIATHLON</title>
<link rel="stylesheet" href="mall.css?v=0.19">
</head>
<body>
<script src="../site-nav.js?v=0.19"></script>
<header class="hero"><p class="kicker">TRIATHLON MALL · 二水市</p><h1>トライアスロンモール</h1><p>二つの川の町のお店。ゲームの中のお金「灯貨」で買い物できます（本物のお金は使いません）。</p>
<div class="wallet"><span>所持金</span><b id="money">0</b><small>灯貨</small><button type="button" id="bonus">今日のおこづかい +300</button></div></header>
<nav class="floors" id="floors" aria-label="売り場"></nav>
<div class="tools"><input id="q" type="search" placeholder="さがす（例：灯石、制服）" aria-label="品物をさがす"><select id="sort" aria-label="並び順"><option value="">おすすめ順</option><option value="low">安い順</option><option value="high">高い順</option></select></div>
<main><ul class="grid" id="grid"></ul></main>
<button class="cartbtn" id="cartbtn" type="button" aria-controls="cart">🛒 カート <b id="count">0</b></button>
<aside class="cart" id="cart" hidden aria-label="カート">
<div class="cart-in"><div class="cart-head"><h2>カート</h2><button type="button" id="close" aria-label="閉じる">✕</button></div>
<ul id="lines"></ul>
<p class="total">合計 <b id="total">0</b> 灯貨</p>
<p class="msg" id="msg" role="status"></p>
<button class="buy" id="buy" type="button">買う</button></div>
</aside>
<footer>この端末に保存されます。<a href="../">TRIATHLON トップ</a></footer>
<script src="items.js?v=0.19"></script>
<script>
(function () {
  'use strict';
  var KEY = 'triathlon-mall-v1', M = window.MALL, $ = function (i) { return document.getElementById(i); };
  var st = { money: 3000, cart: {}, owned: {}, bonus: '' };
  try { var sv = JSON.parse(localStorage.getItem(KEY)); if (sv) st = Object.assign(st, sv); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var floor = 'all', BY = {};
  M.items.forEach(function (it) { BY[it[0]] = it; });
  function yen(n) { return n.toLocaleString('ja-JP'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function today() { return new Date().toISOString().slice(0, 10); }
  $('floors').innerHTML = [['all', 'すべて', '🏬']].concat(M.floors).concat([['own', '持ち物', '🎒']]).map(function (f) {
    return '<button type="button" data-f="' + f[0] + '"><span>' + f[2] + '</span>' + f[1] + '</button>';
  }).join('');
  function render() {
    $('money').textContent = yen(st.money);
    var b = $('bonus'); b.disabled = st.bonus === today(); b.textContent = b.disabled ? 'おこづかいは明日また' : '今日のおこづかい +300';
    document.querySelectorAll('#floors button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.f === floor)); });
    var q = $('q').value.trim(), list = M.items.filter(function (it) {
      if (floor === 'own') return st.owned[it[0]];
      return (floor === 'all' || it[1] === floor) && (!q || (it[3] + it[4]).indexOf(q) >= 0);
    });
    if ($('sort').value === 'low') list.sort(function (a, b) { return a[5] - b[5]; });
    if ($('sort').value === 'high') list.sort(function (a, b) { return b[5] - a[5]; });
    $('grid').innerHTML = list.map(function (it) {
      var own = st.owned[it[0]] || 0, inCart = st.cart[it[0]] || 0;
      return '<li class="item c-' + it[6] + '"><div class="pic" aria-hidden="true">' + it[2] + '</div><div class="body"><h3>' + esc(it[3]) + '</h3><p>' + esc(it[4]) + '</p>' +
        '<div class="row"><b class="price">' + yen(it[5]) + '<small>灯貨</small></b>' + (own ? '<span class="own">持っている ×' + own + '</span>' : '') + '</div>' +
        (floor === 'own' ? '' : '<button type="button" class="add" data-add="' + it[0] + '">' + (inCart ? 'カートに ' + inCart + ' 個' : 'カートに入れる') + '</button>') + '</div></li>';
    }).join('') || '<li class="empty">' + (floor === 'own' ? 'まだ何も持っていません。' : '見つかりませんでした。') + '</li>';
    var n = 0, total = 0;
    Object.keys(st.cart).forEach(function (id) { n += st.cart[id]; total += BY[id][5] * st.cart[id]; });
    $('count').textContent = n; $('total').textContent = yen(total);
    $('lines').innerHTML = Object.keys(st.cart).map(function (id) {
      var it = BY[id];
      return '<li><span>' + it[2] + ' ' + esc(it[3]) + '</span><span class="qty"><button type="button" data-dec="' + id + '" aria-label="減らす">−</button>' + st.cart[id] + '<button type="button" data-add="' + id + '" aria-label="増やす">＋</button></span><b>' + yen(it[5] * st.cart[id]) + '</b></li>';
    }).join('') || '<li class="empty">カートは空です。</li>';
    $('buy').disabled = !n;
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.f) { floor = t.dataset.f; render(); return; }
    if (t.dataset.add) { st.cart[t.dataset.add] = (st.cart[t.dataset.add] || 0) + 1; $('msg').textContent = ''; save(); render(); return; }
    if (t.dataset.dec) { var id = t.dataset.dec; if (--st.cart[id] <= 0) delete st.cart[id]; save(); render(); return; }
  });
  $('bonus').onclick = function () { if (st.bonus === today()) return; st.bonus = today(); st.money += 300; save(); render(); };
  $('q').oninput = render; $('sort').onchange = render;
  $('cartbtn').onclick = function () { $('cart').hidden = false; $('close').focus(); };
  $('close').onclick = function () { $('cart').hidden = true; };
  $('cart').onclick = function (e) { if (e.target === this) this.hidden = true; };
  $('buy').onclick = function () {
    var total = 0; Object.keys(st.cart).forEach(function (id) { total += BY[id][5] * st.cart[id]; });
    if (total > st.money) { $('msg').textContent = 'あと ' + yen(total - st.money) + ' 灯貨たりません'; $('msg').className = 'msg err'; return; }
    st.money -= total;
    Object.keys(st.cart).forEach(function (id) { st.owned[id] = (st.owned[id] || 0) + st.cart[id]; });
    st.cart = {}; save(); render();
    $('msg').textContent = 'お買い上げありがとうございます！「持ち物」で見られます'; $('msg').className = 'msg ok';
  };
  render();
})();
</script>
</body>
</html>
